<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宅建 一発合格ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
html{color-scheme:light dark}
/* Layout: single study column; a mode-select home, a one-question-at-a-time drill, and a scored result sheet */
:root{
  --bg:#F3F4F0; --paper:#FFFFFF; --ink:#18263A; --muted:#5B6676; --line:#D9DDD6;
  --accent:#C8323C; --accent-ink:#FFFFFF; --mark:#F5E46B; --ok:#1F7A4D; --ng:#C8323C; --chip:#E8EBE4;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121821; --paper:#1B2330; --ink:#E7EAEE; --muted:#9AA4B2; --line:#2C3644;
  --accent:#E8545D; --accent-ink:#1A0A0B; --mark:#6B5F1A; --ok:#4FC28A; --ng:#F06A72; --chip:#26303E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121821; --paper:#1B2330; --ink:#E7EAEE; --muted:#9AA4B2; --line:#2C3644;
  --accent:#E8545D; --accent-ink:#1A0A0B; --mark:#6B5F1A; --ok:#4FC28A; --ng:#F06A72; --chip:#26303E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;padding:0 16px}
.wrap{max-width:720px;margin:0 auto;padding-block:24px 64px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,44px);line-height:1.15;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(transparent 60%,var(--mark) 60%)}
.lead{color:var(--muted);margin:8px 0 0}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mode{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px}
.mode:hover{border-color:var(--accent)}
.mode:focus-visible{outline:3px solid var(--accent)}
.mode b{font-size:17px}
.mode span{font-size:13px;color:var(--muted)}
.mode.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode.primary span{color:inherit;opacity:.75}
.stats{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted)}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--ink)}
.chip.trap{background:var(--accent);color:var(--accent-ink)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.q{font-size:17px;font-weight:500;white-space:pre-wrap}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.choice:hover:not([disabled]){border-color:var(--ink)}
.choice:focus-visible{outline:3px solid var(--accent)}
.choice .n{font-family:var(--display);min-width:1.4em}
.choice.ok{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.choice.ng{border-color:var(--ng);box-shadow:inset 4px 0 0 var(--ng);opacity:.85}
.choice[disabled]{cursor:default}
.verdict{font-family:var(--display);font-size:22px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.trapbox{background:var(--mark);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:14px}
:root[data-theme="dark"] .trapbox{color:#FFF6C8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .trapbox{color:#FFF6C8}}
.exp{font-size:15px;white-space:pre-wrap}
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.score{font-family:var(--display);font-size:clamp(48px,14vw,80px);line-height:1;font-variant-numeric:tabular-nums}
.pass{font-weight:700}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td:last-child,th:last-child{text-align:right}
.conf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.conf button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:700}
.conf button:hover{border-color:var(--accent)}
.choice.picked{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--ink)}
.diag{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.diag div{background:var(--chip);border-radius:8px;padding:10px;font-size:13px}
.diag b{display:block;font-family:var(--display);font-size:22px;font-weight:400}
.toggle{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px}
.toggle button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.miss{font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.foot{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap" id="app"></div>
<script>
// 宅建試験 4択問題集（2026年10月試験対応・2026年施行法令ベース）
window.TAKKEN_QUESTIONS = [
{"id":1,"cat":"宅建業法","tag":"頻出論点","q":"宅地建物取引業の免許に関する次の記述のうち、正しいものはどれか。","choices":["国土交通大臣の免許を受けた業者が、一の都道府県内のみに事務所を有することとなった場合、その都道府県知事へ免許換えを申請しなければならない。","免許の有効期間は3年である。","個人業者が死亡した場合、相続人は死亡の日から30日以内に届け出なければならない。","法人業者が合併により消滅した場合、合併後存続する法人の代表役員が届出義務者となる。"],"answer":0,"exp":"①正：大臣免許→知事免許への免許換え（宅建業法7条）。②誤：有効期間は5年（3条2項）。③誤：死亡の事実を『知った日』から30日以内（11条）。④誤：合併消滅の届出義務者は『消滅した法人の代表役員であった者』。","trap":"死亡は『知った日から』、合併は『消滅会社の元代表役員』が届出。"},
{"id":2,"cat":"宅建業法","tag":"ひっかけ","q":"免許の欠格事由に関する次の記述のうち、正しいものはどれか。","choices":["拘禁刑に処せられたが執行猶予が付された者は、執行猶予期間満了から5年を経過しなければ免許を受けることができない。","傷害罪により罰金刑に処せられ、その刑の執行を終えてから5年を経過しない者は、免許を受けることができない。","道路交通法違反で罰金刑に処せられた者は、5年間免許を受けることができない。","刑法上の過失傷害罪により罰金刑に処せられた者は、刑の執行を終えてから5年間免許を受けることができない。"],"answer":1,"exp":"②正：傷害罪・暴行罪・背任罪・脅迫罪等や宅建業法違反による罰金刑は欠格（5条1項6号）。①誤：執行猶予期間が満了すれば直ちに免許可。③誤：道交法違反の罰金は欠格事由でない。④誤：過失傷害罪は罰金で欠格となる罪に含まれない。","trap":"執行猶予期間満了＝直ちにOK。罰金で欠格になる罪の種類に注意。"},
{"id":3,"cat":"宅建業法","tag":"頻出論点","q":"営業保証金に関する次の記述のうち、正しいものはどれか。","choices":["営業保証金は、金銭のみで供託しなければならない。","営業保証金は、宅建業者の最寄りの供託所に供託すればよい。","営業保証金の額は、主たる事務所につき1,000万円、その他の事務所につき事務所ごとに500万円の合計額である。","支店を新設した場合、当該支店の最寄りの供託所に500万円を供託する。"],"answer":2,"exp":"③正（25条2項・施行令2条の4）。①誤：国債証券・地方債証券等の有価証券でも可。②④誤：本店（主たる事務所）の最寄りの供託所に供託する。","trap":"支店分も『本店の最寄り』の供託所。"},
{"id":4,"cat":"宅建業法","tag":"ひっかけ","q":"営業保証金に関する次の記述のうち、誤っているものはどれか。","choices":["免許権者は、免許をした日から3月以内に供託した旨の届出がないときは、届出をすべき旨の催告をしなければならない。","催告が到達した日から1月以内に届出がないときは、免許権者は免許を取り消すことができる。","営業保証金を取り戻す場合、原則として6月以上の期間を定めて公告しなければならない。","保証協会の社員となったことにより営業保証金を取り戻す場合も、6月以上の期間を定めた公告が必要である。"],"answer":3,"exp":"④誤：保証協会の社員となった場合は公告不要で直ちに取り戻せる（30条2項ただし書）。①②③は正（25条6項・7項、30条2項）。取消しは『できる』（任意的）。","trap":"公告不要の例外：保証協会加入、主たる事務所移転による二重供託、取戻し事由発生から10年経過。"},
{"id":5,"cat":"宅建業法","tag":"頻出論点","q":"宅地建物取引業保証協会に関する次の記述のうち、正しいものはどれか。","choices":["保証協会に加入しようとする者は、加入しようとする日までに弁済業務保証金分担金を保証協会に納付しなければならない。","弁済業務保証金分担金の額は、主たる事務所60万円、その他の事務所ごとに50万円である。","社員が新たに事務所を設置した場合、その日から1月以内に分担金を納付しなければならない。","保証協会は、分担金の納付を受けたときは、その日から2週間以内に法務大臣の定める供託所に弁済業務保証金を供託しなければならない。"],"answer":0,"exp":"①正（64条の9第1項）。②誤：その他の事務所は30万円。③誤：2週間以内。④誤：1週間以内に供託（64条の7）。","trap":"分担金は本店60万・支店30万。新事務所は2週間、協会の供託は1週間。"},
{"id":6,"cat":"宅建業法","tag":"ひっかけ","q":"保証協会の社員が社員の地位を失った場合に関する次の記述のうち、正しいものはどれか。","choices":["社員の地位を失った日から2週間以内に営業保証金を供託しなければならない。","社員の地位を失った日から1週間以内に営業保証金を供託しなければならない。","社員の地位を失った日から1月以内に営業保証金を供託しなければならない。","社員の地位を失った場合、営業保証金の供託は不要で、改めて保証協会に加入すればよい。"],"answer":1,"exp":"②正：地位喪失の日から1週間以内に営業保証金を供託（64条の15）。","trap":"還付充当金の納付は『通知を受けた日から2週間』、地位喪失後の供託は『1週間』。"},
{"id":7,"cat":"宅建業法","tag":"頻出論点","q":"保証協会の還付に関する次の記述のうち、正しいものはどれか。","choices":["還付を受けようとする者は、直接供託所に請求すればよく、保証協会の認証は不要である。","還付額は、当該社員が納付した分担金の額が上限である。","還付を受けられる者は、宅建業者に該当する者を除いた、社員と宅建業に関し取引をした者である。","社員は、還付充当金納付の通知を受けた日から1週間以内に納付しなければならない。"],"answer":2,"exp":"③正：2017年改正で宅建業者は還付対象外（64条の8）。①誤：保証協会の認証が必要。②誤：社員でなかったとしたら供託すべき営業保証金の額が上限。④誤：2週間以内（64条の10）。","trap":"還付上限は『分担金の額』ではなく『営業保証金相当額』。"},
{"id":8,"cat":"宅建業法","tag":"頻出論点","q":"宅地建物取引士の登録に関する次の記述のうち、正しいものはどれか。","choices":["登録を受けている者が住所を変更した場合、30日以内に変更の登録を申請しなければならない。","登録の移転は、勤務先の変更がなくても住所を移転すれば申請しなければならない。","登録を受けた者が死亡した場合、相続人は死亡の日から30日以内に届け出なければならない。","登録を受けている者が本籍を変更した場合、遅滞なく変更の登録を申請しなければならない。"],"answer":3,"exp":"④正（20条）。①誤：『遅滞なく』。②誤：登録の移転は勤務先の事務所が他県になった場合に『できる』（任意）。住所移転のみでは不可。③誤：死亡を知った日から30日以内。","trap":"宅建士の変更登録は『遅滞なく』、業者名簿の変更届は『30日以内』。"},
{"id":9,"cat":"宅建業法","tag":"ひっかけ","q":"宅地建物取引士証に関する次の記述のうち、正しいものはどれか。","choices":["宅建士証の有効期間は5年であり、更新を受けようとする者は、申請前6月以内に行われる登録を受けた知事が指定する講習を受講しなければならない。","宅建士証の有効期間は3年である。","登録の移転をした場合、移転前の宅建士証はそのまま有効期間が5年延長される。","宅建士は、取引の関係者から請求があっても、重要事項説明時以外は宅建士証を提示する必要はない。"],"answer":0,"exp":"①正（22条の2・22条の3）。③誤：移転後の宅建士証の有効期間は移転前の残存期間。④誤：関係者から請求があれば提示義務（22条の4）。","trap":"登録の移転後の宅建士証は『残存期間』のみ有効。"},
{"id":10,"cat":"宅建業法","tag":"頻出論点","q":"専任の宅地建物取引士に関する次の記述のうち、正しいものはどれか。","choices":["専任の宅建士が不足した場合、30日以内に必要な措置を執らなければならない。","事務所には、業務に従事する者5人に1人以上の割合で成年者である専任の宅建士を置かなければならない。","契約の締結のみを行う案内所には、業務に従事する者5人に1人以上の専任の宅建士を置かなければならない。","未成年者は、いかなる場合も専任の宅建士となることができない。"],"answer":1,"exp":"②正（31条の3、規則15条の5の3）。①誤：2週間以内。③誤：案内所等は1人以上。④誤：業者本人（または法人役員）である宅建士は成年者とみなされる。","trap":"不足補充は『2週間』、案内所は『1人以上』。"},
{"id":11,"cat":"宅建業法","tag":"ひっかけ","q":"宅建業者が契約の締結等を行う案内所を設置する場合の届出に関する次の記述のうち、正しいものはどれか。","choices":["業務を開始した日から10日以内に届け出なければならない。","業務を開始する日の2週間前までに届け出なければならない。","業務を開始する日の10日前までに、免許権者及び案内所の所在地を管轄する知事に届け出なければならない。","案内所の所在地を管轄する知事にのみ届け出れば足りる。"],"answer":2,"exp":"③正（50条2項）。大臣免許の場合は所在地知事を経由して大臣へも届け出る。","trap":"『開始の10日前まで』で、事後ではない。"},
{"id":12,"cat":"宅建業法","tag":"頻出論点","q":"専任媒介契約に関する次の記述のうち、正しいものはどれか（依頼者は宅建業者でないものとする）。","choices":["専任媒介契約の有効期間は、依頼者の申出がなくても自動更新とする特約が有効である。","専任媒介契約では、業務処理状況を1週間に1回以上報告しなければならない。","専任媒介契約では、契約締結日から5日以内（休業日を除く）に指定流通機構に登録しなければならない。","専任媒介契約の有効期間は3月を超えることができず、これより長い期間を定めたときは3月とされる。"],"answer":3,"exp":"④正（34条の2第3項）。①誤：更新は依頼者の申出が必要。②誤：専任は2週間に1回以上（専属専任は1週間に1回以上）。③誤：専任は7日以内（専属専任は5日以内）。","trap":"専任：2週・7日／専属専任：1週・5日。"},
{"id":13,"cat":"宅建業法","tag":"ひっかけ","q":"媒介契約書面（34条の2書面）に関する次の記述のうち、正しいものはどれか。","choices":["一般媒介契約であっても、宅建業者は媒介契約書面を作成して記名押印し、依頼者に交付しなければならない。","媒介契約書面には、宅建士が記名しなければならない。","貸借の媒介契約でも、媒介契約書面の交付が必要である。","依頼者が宅建業者である場合、媒介契約書面の交付は不要である。"],"answer":0,"exp":"①正：一般媒介も対象（34条の2第1項）。②誤：記名押印は宅建業者で、宅建士の記名は不要。③誤：34条の2は売買・交換の媒介のみ。④誤：業者間でも適用。なお依頼者の承諾があれば電磁的方法による提供も可。","trap":"媒介契約書面＝業者が記名押印、宅建士不要、貸借は対象外。"},
{"id":14,"cat":"宅建業法","tag":"頻出論点","q":"重要事項説明（35条）に関する次の記述のうち、正しいものはどれか。","choices":["重要事項の説明は、契約締結後遅滞なく行えばよい。","重要事項の説明は宅建士が行う必要があるが、専任の宅建士である必要はない。","重要事項説明書は、売主と買主の双方に交付しなければならない。","買主が宅建業者である場合でも、宅建士による説明を省略することはできない。"],"answer":1,"exp":"②正。①誤：契約が成立するまでの間に説明。③誤：交付先は買主・借主等（取得しようとする者）。④誤：買主が業者なら書面交付のみで説明は不要（35条6項）。","trap":"35条は『契約前』『買主・借主へ』。37条は『契約後遅滞なく』『双方へ』。"},
{"id":15,"cat":"宅建業法","tag":"ひっかけ","q":"35条書面の記載事項に関する次の記述のうち、正しいものはどれか。","choices":["建物の売買の媒介において、建物の貸借の場合と同様に、契約期間及び契約更新に関する事項を説明しなければならない。","宅地の貸借の媒介において、私道に関する負担に関する事項の説明は不要である。","建物の貸借の媒介において、台所・浴室・便所その他の設備の整備状況を説明しなければならない。","既存建物の売買において、建物状況調査を実施しているかどうかの説明は不要である。"],"answer":2,"exp":"③正（規則16条の4の3）。①誤：契約期間・更新は貸借の場合の事項。②誤：私道負担の説明が不要なのは『建物の貸借』のみ。④誤：既存建物では建物状況調査の実施の有無等の説明が必要。","trap":"私道負担が説明不要なのは『建物の貸借』だけ。"},
{"id":16,"cat":"宅建業法","tag":"頻出論点","q":"37条書面に関する次の記述のうち、正しいものはどれか。","choices":["37条書面は、買主にのみ交付すれば足りる。","37条書面への記名は、専任の宅建士でなければならない。","37条書面の交付は、契約締結前に行わなければならない。","37条書面には宅建士が記名しなければならないが、宅建士による内容の説明は義務付けられていない。"],"answer":3,"exp":"④正（37条3項）。①誤：契約の各当事者に交付。②誤：専任である必要はない。③誤：契約締結後遅滞なく。","trap":"37条書面に説明義務なし。"},
{"id":17,"cat":"宅建業法","tag":"ひっかけ","q":"37条書面の記載事項のうち、定めがある場合にのみ記載すれば足りる『任意的記載事項』に該当しないものはどれか（売買の場合）。","choices":["移転登記の申請の時期","代金以外の金銭の授受に関する定め","契約の解除に関する定め","天災その他不可抗力による損害の負担に関する定め"],"answer":0,"exp":"移転登記の申請の時期は必要的記載事項（37条1項5号）。②③④は定めがあるときに記載する任意的記載事項。","trap":"『登記申請時期』『引渡し時期』『代金の額・支払時期・方法』は必ず記載。"},
{"id":18,"cat":"宅建業法","tag":"頻出論点","q":"宅建業法の電磁的方法による書面の提供に関する次の記述のうち、正しいものはどれか。","choices":["37条書面は、相手方の承諾がなくても電磁的方法で提供できる。","35条書面を電磁的方法で提供するには、相手方の承諾が必要である。","電磁的方法で提供する35条書面には、宅建士の記名に代わる措置は不要である。","電磁的方法による35条書面の提供を行えば、宅建士による説明は不要となる。"],"answer":1,"exp":"②正：2022年5月施行改正。承諾が必要（35条8項等）。①誤：37条も承諾が必要。③誤：宅建士が明示される措置が必要。④誤：説明義務は残る（IT重説は可）。","trap":"電子化しても『説明義務』は消えない。"},
{"id":19,"cat":"宅建業法","tag":"頻出論点","q":"宅建業者Aが自ら売主として宅建業者でないBと売買契約を締結した場合のクーリング・オフに関する次の記述のうち、正しいものはどれか。","choices":["Bが喫茶店で申込みをした場合でも、Bが喫茶店を指定したときはクーリング・オフできない。","Aの事務所で申込みをした場合でも、契約を喫茶店で締結したときはクーリング・オフできる。","Bが申し出て自宅で買受けの申込みをした場合、Bはクーリング・オフできない。","クーリング・オフの意思表示は、書面がAに到達した時に効力を生じる。"],"answer":2,"exp":"③正：買主が申し出た自宅・勤務先は事務所等扱い（規則16条の5）。①誤：喫茶店は買主の指定でも可。②誤：申込みの場所で判断。事務所で申込み→不可。④誤：書面を発した時に効力（37条の2第2項）。","trap":"判断基準は『申込みの場所』、効力は『発信時』。"},
{"id":20,"cat":"宅建業法","tag":"ひっかけ","q":"クーリング・オフに関する次の記述のうち、正しいものはどれか（売主は宅建業者、買主は非業者、テント張り案内所で申込み）。","choices":["口頭で告げられた日から8日を経過したときは、クーリング・オフできない。","宅地の引渡しを受けた場合、代金を支払っていなくてもクーリング・オフできない。","代金の全部を支払った場合、引渡しを受けていなくてもクーリング・オフできない。","クーリング・オフできる旨等を書面で告げられた日から起算して8日を経過したときは、クーリング・オフできない。"],"answer":3,"exp":"④正。①誤：書面による告知が必要。②③誤：『引渡し』かつ『代金全部支払い』の両方で不可となる。","trap":"『引渡し＋全額支払い』の両方が揃って初めて不可。"},
{"id":21,"cat":"宅建業法","tag":"頻出論点","q":"宅建業者Aが自ら売主となり、非業者Bに代金4,000万円で建物を売却する場合の手付に関する次の記述のうち、正しいものはどれか。","choices":["Aは、800万円を超える手付を受領することはできない。","手付を『証約手付』とする特約があれば、Bは手付を放棄して解除することはできない。","Aが契約の履行に着手した後でも、Bは手付を放棄して解除できる。","手付の額が代金の2割を超える特約は全部無効となる。"],"answer":0,"exp":"①正：代金の2割まで（39条1項）。②誤：どのような手付でも解約手付とされ、買主に不利な特約は無効。③誤：相手方が履行に着手した後は不可。④誤：超える部分のみ無効。","trap":"2割超は『超過部分』が無効。"},
{"id":22,"cat":"宅建業法","tag":"ひっかけ","q":"宅建業者Aが自ら売主、非業者Bが買主の場合、損害賠償額の予定に関する次の記述のうち、正しいものはどれか（代金3,000万円）。","choices":["損害賠償額の予定を定めなかった場合、Aは代金の2割を超える損害賠償を請求できない。","損害賠償額の予定と違約金を合算して600万円を超える定めをした場合、超える部分は無効となる。","損害賠償額の予定を800万円とした場合、その定め全体が無効となり、実損額の請求もできない。","損害賠償額の予定と違約金はそれぞれ600万円まで定めることができる。"],"answer":1,"exp":"②正（38条）。①誤：予定がなければ実損額を請求可（2割制限はない）。③誤：超過部分のみ無効。④誤：合算で2割。","trap":"定めがない場合は実損額請求でき、2割制限はない。"},
{"id":23,"cat":"宅建業法","tag":"頻出論点","q":"手付金等の保全措置に関する次の記述のうち、正しいものはどれか（売主業者・買主非業者）。","choices":["完成物件の場合、受領する手付金等が代金の5%以下かつ1,000万円以下であれば保全措置は不要である。","買主への所有権移転登記がされた後であっても、保全措置を講じなければならない。","未完成物件の場合、受領する手付金等が代金の5%以下かつ1,000万円以下であれば保全措置は不要である。","未完成物件の保全措置として、指定保管機関による保管を利用できる。"],"answer":2,"exp":"③正（41条）。①誤：完成物件は10%以下かつ1,000万円以下。②誤：登記後は不要。④誤：指定保管機関は完成物件のみ。","trap":"未完成5%／完成10%。保管は完成物件のみ。"},
{"id":24,"cat":"宅建業法","tag":"ひっかけ","q":"宅建業者Aが自ら売主として非業者Bと売買契約をする場合の契約不適合責任の特約に関する次の記述のうち、正しいものはどれか。","choices":["契約締結の日から2年間とする通知期間の特約は有効である。","Aは一切責任を負わない旨の特約は、Bが承諾すれば有効である。","通知期間について特約で定めなかった場合、引渡しから2年となる。","引渡しの日から2年間とする通知期間の特約は有効である。"],"answer":3,"exp":"④正（40条）。①誤：起算点が契約日では引渡日より前になり不利→無効。②誤：無効。③誤：特約が無効または定めなし→民法どおり不適合を知った時から1年以内に通知。","trap":"『契約締結日から2年』は無効。無効時は民法の原則に戻る。"},
{"id":25,"cat":"宅建業法","tag":"頻出論点","q":"宅建業者が自ら売主となる場合の自己の所有に属しない物件の売買契約の制限に関する次の記述のうち、正しいものはどれか（買主は非業者）。","choices":["売主業者が当該物件を取得する契約（予約を含む）を締結していれば、売買契約を締結できる。","物件取得契約が停止条件付であっても、売買契約を締結できる。","買主が宅建業者であっても、自己の所有に属しない物件の売買契約は締結できない。","未完成物件の場合、手付金等の保全措置を講じても売買契約を締結できない。"],"answer":0,"exp":"①正（33条の2）。②誤：停止条件付の取得契約では不可。③誤：業者間取引には適用なし。④誤：保全措置を講じれば可。","trap":"8種制限は業者間取引に適用されない。"},
{"id":26,"cat":"宅建業法","tag":"頻出論点","q":"宅建業者が売買の媒介で、売主・買主双方から報酬を受ける場合、代金2,000万円（消費税非課税の土地）のとき、課税事業者である業者が一方から受領できる上限額はどれか。","choices":["792,000円","726,000円","660,000円","1,452,000円"],"answer":1,"exp":"2,000万円×3%＋6万円＝66万円、課税事業者は×1.1で72万6,000円。一方から受領できる上限（双方なら各72.6万円）。","trap":"双方合計の上限ではなく『一方から』の額。"},
{"id":27,"cat":"宅建業法","tag":"ひっかけ","q":"2024年7月施行の報酬告示改正（低廉な空家等の特例）に関する次の記述のうち、正しいものはどれか。","choices":["特例の対象は代金400万円以下の物件に限られる。","特例は売主からの報酬に限り適用され、買主からは受領できない。","代金800万円以下の宅地建物の売買の媒介では、現地調査等の費用を含め、依頼者の一方から30万円の1.1倍（税込33万円）まで受領できる。","特例の適用には依頼者との事前合意は不要である。"],"answer":2,"exp":"③正：対象は800万円以下、上限30万円（税別）。①誤：改正前は400万円以下・18万円。②誤：改正で買主からも受領可能に。④誤：あらかじめ依頼者に説明し合意することが必要。","trap":"旧基準400万・18万との混同に注意。"},
{"id":28,"cat":"宅建業法","tag":"頻出論点","q":"居住用建物の貸借の媒介（借賃月額10万円・消費税別）に関する次の記述のうち、正しいものはどれか。依頼者の承諾は得ていないものとする。","choices":["業者は貸主から110,000円、借主から110,000円を受領できる。","権利金の授受がある場合、権利金を売買代金とみなして報酬を計算することができる。","依頼者の承諾があれば、借主から借賃の1.5月分を受領できる。","課税事業者である業者は、貸主・借主それぞれから55,000円まで受領できる。"],"answer":3,"exp":"④正：居住用は承諾なき限り一方から0.5月分（＋税）。①誤：双方合計で1月分＋税が上限。②誤：権利金による計算は居住用建物には不可。③誤：承諾があっても一方から1月分が上限。","trap":"居住用建物は権利金の特例が使えない。"},
{"id":29,"cat":"宅建業法","tag":"ひっかけ","q":"報酬に関する次の記述のうち、正しいものはどれか。","choices":["依頼者の依頼によらない広告の料金は、報酬とは別に受領することはできない。","依頼者の依頼による特別の広告料金であっても、報酬限度額を超えて受領することはできない。","業者は、報酬とは別に、重要事項説明の費用を受領できる。","代理の場合、依頼者から代金に応じた報酬額の3倍まで受領できる。"],"answer":0,"exp":"①正。②誤：依頼者の依頼による広告の料金は別途受領可。③誤：不可。④誤：代理は2倍まで（双方から受ける合計も2倍以内）。","trap":"代理は『2倍』。"},
{"id":30,"cat":"宅建業法","tag":"頻出論点","q":"広告に関する次の記述のうち、正しいものはどれか。","choices":["建築確認申請中であれば、その旨を表示すれば広告できる。","未完成の建物について、建築確認を受ける前は、売買の広告だけでなく貸借の広告もできない。","誇大広告をしても、実際に取引の相手方が誤認しなければ宅建業法違反とならない。","取引態様の別は、注文を受けたときに明示すれば、広告時に明示する必要はない。"],"answer":1,"exp":"②正（33条）。広告開始時期の制限は貸借も対象。①誤：確認後でなければ不可。③誤：誤認・損害がなくても違反。④誤：広告時と注文時の両方で明示（34条）。","trap":"広告開始時期は貸借も対象、契約締結時期の制限は貸借を除く。"},
{"id":31,"cat":"宅建業法","tag":"ひっかけ","q":"契約締結等の時期の制限（36条）に関する次の記述のうち、正しいものはどれか。","choices":["未完成建物の売買の媒介は、建築確認申請中であれば契約を締結できる。","未完成建物の交換は、建築確認前でも予約であれば締結できる。","未完成建物の貸借の媒介は、建築確認前であっても契約を締結できる。","未完成建物の貸借の代理は、建築確認前は契約締結できない。"],"answer":2,"exp":"③正：36条は売買・交換のみ規制、貸借は対象外。①②誤：予約も含め禁止。④誤。","trap":"広告は貸借もNG、契約は貸借ならOK。"},
{"id":32,"cat":"宅建業法","tag":"頻出論点","q":"帳簿・従業者名簿に関する次の記述のうち、正しいものはどれか。","choices":["帳簿は主たる事務所に一括して備え付ければよい。","従業者名簿は、最終記載日から5年間保存しなければならない。","従業者名簿は、取引の関係者から請求があっても閲覧させる必要はない。","帳簿は、各事業年度末日に閉鎖し、閉鎖後5年間（自ら売主となる新築住宅は10年間）保存しなければならない。"],"answer":3,"exp":"④正（49条、規則18条）。①誤：事務所ごと。②誤：10年間。③誤：請求があれば閲覧させる。","trap":"帳簿5年（新築売主10年）、従業者名簿10年。"},
{"id":33,"cat":"宅建業法","tag":"頻出論点","q":"標識・報酬額の掲示に関する次の記述のうち、正しいものはどれか。","choices":["報酬額の掲示は事務所ごとに必要だが、案内所には不要である。","標識は事務所にのみ掲示すれば足りる。","契約を締結しない案内所には標識の掲示は不要である。","一団の宅地建物の分譲を他の業者に代理させる場合、売主業者は現地に標識を掲げる必要はない。"],"answer":0,"exp":"①正（46条4項）。②③誤：案内所・現地等も標識が必要（申込み・契約しない案内所も含む）。④誤：分譲の現地には売主業者の標識が必要。","trap":"報酬額掲示は事務所のみ、標識は案内所等にも必要。"},
{"id":34,"cat":"宅建業法","tag":"ひっかけ","q":"業務上の規制に関する次の記述のうち、宅建業法に違反しないものはどれか。","choices":["手付を分割払いとすることで契約締結を誘引した。","手付について、銀行からの融資をあっせんした。","手付金を貸し付けることで契約締結を誘引した。","契約締結の判断に必要な時間を与えることを拒んだ。"],"answer":1,"exp":"②違反しない：金融機関の融資あっせんは信用供与に当たらない。①③は手付の信用供与で禁止（47条3号）。④は禁止行為（規則16条の11）。","trap":"『手付の減額』は、相手に告知して行うなら信用供与に当たらない。"},
{"id":35,"cat":"宅建業法","tag":"頻出論点","q":"宅建業者の守秘義務に関する次の記述のうち、正しいものはどれか。","choices":["裁判で証人として証言を求められた場合でも、秘密を漏らしてはならない。","従業者は、退職後は守秘義務を負わない。","宅建業者は、宅建業を廃業した後であっても、業務上知り得た秘密を正当な理由なく漏らしてはならない。","依頼者本人の承諾があっても、秘密を開示してはならない。"],"answer":2,"exp":"③正（45条）。①④：正当な理由に当たり開示可。②誤：従業者も退職後も負う（75条の3）。","trap":""},
{"id":36,"cat":"宅建業法","tag":"頻出論点","q":"住宅瑕疵担保履行法に関する次の記述のうち、正しいものはどれか。","choices":["買主が宅建業者である場合も、資力確保措置を講じなければならない。","中古住宅の売主である宅建業者も、資力確保措置を講じなければならない。","届出をしなかった場合、基準日の翌日から1月を経過した日以後、新たに新築住宅の売買契約を締結できない。","新築住宅の売主である宅建業者は、基準日ごとに、基準日から3週間以内に資力確保措置の状況を免許権者に届け出なければならない。"],"answer":3,"exp":"④正（基準日は毎年3月31日）。①誤：買主が業者なら不要。②誤：新築住宅のみ。③誤：50日を経過した日以後。","trap":"届出3週間、契約締結禁止は50日経過後。"},
{"id":37,"cat":"宅建業法","tag":"ひっかけ","q":"住宅瑕疵担保履行法の供託所の説明に関する次の記述のうち、正しいものはどれか。","choices":["住宅販売瑕疵担保保証金の供託をしている業者は、売買契約を締結するまでに、供託所の所在地等を記載した書面を交付して説明しなければならない。","供託所の説明は、引渡しまでに行えばよい。","供託所の説明は、宅建士が行わなければならない。","保険に加入している場合も、供託所の説明が必要である。"],"answer":0,"exp":"①正（履行法15条）。③誤：宅建士である必要はない。④誤：供託の場合の義務。","trap":""},
{"id":38,"cat":"宅建業法","tag":"頻出論点","q":"監督処分に関する次の記述のうち、正しいものはどれか。","choices":["指示処分は、免許権者のみが行うことができる。","業務停止処分の期間は1年以内である。","宅建業者が免許を受けてから1年以内に事業を開始しない場合、免許権者は免許を取り消すことができる（任意）。","免許取消処分をする場合、聴聞を行う必要はない。"],"answer":1,"exp":"②正（65条）。①誤：業務地の知事も指示・業務停止可。③誤：必要的取消し（66条1項6号）。④誤：聴聞が必要（69条）。","trap":"1年以内に事業開始しない→『取り消さなければならない』。"},
{"id":39,"cat":"宅建業法","tag":"ひっかけ","q":"宅建士に対する監督処分に関する次の記述のうち、正しいものはどれか。","choices":["事務禁止処分の期間は2年以内である。","事務禁止処分期間中に自ら登録消除を申請した場合、消除の日から5年間は登録を受けられない。","事務禁止処分を受けた宅建士は、速やかに宅建士証を処分をした知事に提出しなければならない。","宅建士証を提出しなかった場合でも罰則はない。"],"answer":2,"exp":"③正（22条の2第7項）。①誤：1年以内。②誤：事務禁止期間が満了するまで登録できない。④誤：10万円以下の過料。","trap":"自ら消除→登録不可は『禁止期間満了まで』。"},
{"id":40,"cat":"宅建業法","tag":"頻出論点","q":"宅建業の定義に関する次の記述のうち、免許が必要なものはどれか。","choices":["Bが自己所有のマンションを多数の者に反復継続して賃貸する。","国が宅地を分譲する。","Cが他人の所有する建物を転貸する（サブリース）。","Aが自己所有の宅地を区画割りし、不特定多数に反復継続して売却する。"],"answer":3,"exp":"④免許必要。①③自ら貸借は宅建業に当たらない。②国・地方公共団体には適用なし。","trap":"自ら貸主・転貸主は宅建業でない。"},
{"id":41,"cat":"宅建業法","tag":"ひっかけ","q":"信託会社・農協等の宅建業法の適用に関する次の記述のうち、正しいものはどれか。","choices":["信託会社は、国土交通大臣に届け出ることで、免許を受けずに宅建業を営むことができる。","農業協同組合が宅地の分譲を反復継続して行う場合、宅建業の免許は不要である。","破産管財人の依頼を受けて媒介する業者は免許が不要である。","地方公共団体から依頼を受けて媒介をする業者は免許が不要である。"],"answer":0,"exp":"①正（77条）。②誤：農協は国等に当たらず免許必要。③④誤：依頼者が国等・破産管財人でも、媒介をする業者は免許必要。","trap":"国等の『代わりに動く業者』は免許が必要。"},
{"id":42,"cat":"宅建業法","tag":"頻出論点","q":"『事務所』に関する次の記述のうち、正しいものはどれか。","choices":["宅建業を営まない支店であっても、本店で宅建業を営んでいれば事務所に該当する。","継続的に業務を行うことができる施設を有し、契約締結権限を有する使用人を置く場所は事務所に該当する。","本店で宅建業を営まず支店のみで宅建業を営む場合、本店は事務所に該当しない。","案内所は、契約を締結すれば事務所に該当する。"],"answer":1,"exp":"②正（施行令1条の2）。①誤：支店は宅建業を営むものに限り事務所。③誤：支店で宅建業を営めば本店は常に事務所。④誤：案内所は事務所ではない。","trap":"本店は支店で宅建業を営めば常に事務所。"},
{"id":43,"cat":"宅建業法","tag":"ひっかけ","q":"免許換えに関する次の記述のうち、正しいものはどれか。","choices":["免許換えにより受けた新しい免許の有効期間は、従前の免許の残存期間である。","免許換えの申請を怠った場合でも、免許が取り消されることはない。","甲県知事免許の業者が乙県に事務所を移転し甲県の事務所を廃止した場合、乙県知事に直接免許換えを申請する。","免許換えをした場合、従前の免許の残存期間が経過するまで新免許の効力は生じない。"],"answer":2,"exp":"③正（7条）。①誤：新免許の有効期間は新たに5年。②誤：免許換え申請を怠ると必要的取消し（66条1項5号）。④誤：新免許の交付により従前の免許は失効し新免許が効力を生じる。","trap":"免許換え後は新たに5年。"},
{"id":44,"cat":"宅建業法","tag":"頻出論点","q":"宅建業者名簿の変更の届出に関する次の記述のうち、届出が必要なものはどれか。","choices":["専任でない宅建士の変更","政令使用人ではない従業者の住所変更","代表者の住所変更","法人業者の非常勤役員の変更"],"answer":3,"exp":"④役員は常勤・非常勤を問わず届出事項（30日以内）。①専任宅建士の氏名のみ。②③住所は届出事項でない。","trap":"役員・政令使用人・専任宅建士の『氏名』のみ。住所は不要。"},
{"id":45,"cat":"宅建業法","tag":"ひっかけ","q":"宅建士の登録の欠格に関する次の記述のうち、正しいものはどれか。","choices":["宅建業に係る営業に関し成年者と同一の行為能力を有しない未成年者は、登録を受けることができない。","破産者で復権を得た者は、復権後5年を経過しなければ登録を受けられない。","不正手段で免許を取得して免許を取り消された法人の、聴聞公示前60日以内の役員は、取消しから3年間登録を受けられない。","心身の故障がある者は、一律に登録を受けることができない。"],"answer":0,"exp":"①正（18条1項1号）。②誤：復権を得れば直ちに可。③誤：5年間。④誤：『宅建士の事務を適正に行うことができない者として国土交通省令で定める者』に限る。","trap":"復権＝直ちにOK。"},
{"id":46,"cat":"宅建業法","tag":"頻出論点","q":"35条書面の説明事項として、宅地建物の売買で説明が必要なものはどれか。","choices":["引渡しの時期","水防法に基づく水害ハザードマップにおける物件の所在地","移転登記の申請時期","契約不適合責任の内容"],"answer":1,"exp":"②：2020年8月から説明事項（規則16条の4の3）。①③は37条の記載事項。④は37条の任意的記載事項（35条は保証保険措置の有無）。","trap":"35条は『責任履行措置の有無』、37条は『責任の内容』。"},
{"id":47,"cat":"宅建業法","tag":"ひっかけ","q":"重要事項説明をテレビ会議等のITを活用して行う場合に関する次の記述のうち、正しいものはどれか。","choices":["IT重説は貸借の場合のみ認められる。","IT重説を行えば、重要事項説明書の交付は不要となる。","宅建士は、説明開始前に相手方が宅建士証を視認できたことを画面上で確認しなければならない。","IT重説では、宅建士証の提示は不要である。"],"answer":2,"exp":"③正。①誤：売買も可（2021年本格運用）。②誤：書面（または承諾ある電磁的提供）は必要。④誤：画面で提示。","trap":""},
{"id":48,"cat":"宅建業法","tag":"頻出論点","q":"割賦販売契約の解除等の制限に関する次の記述のうち、正しいものはどれか（売主業者・買主非業者）。","choices":["14日以上の期間を定めて口頭で催告すれば解除できる。","賦払金の不払いがあれば、直ちに残金全額の支払いを請求できる旨の特約は有効である。","業者間の割賦販売にも適用される。","賦払金の支払いがない場合、30日以上の相当期間を定めて書面で催告し、期間内に支払いがないときでなければ契約を解除できない。"],"answer":3,"exp":"④正（42条）。②誤：無効。③誤：8種制限は業者間に適用なし。","trap":""},
{"id":49,"cat":"宅建業法","tag":"ひっかけ","q":"宅建業者が自ら売主となる売買で、相手方が宅建業者でない場合でも8種制限が適用されないものはどれか。","choices":["媒介業者が非業者の売主と非業者の買主を仲介する場合","売主業者が買主非業者に土地を売る場合","売主業者が買主非業者に未完成マンションを売る場合","売主業者がテント張り案内所で非業者と契約する場合"],"answer":0,"exp":"8種制限は『業者が自ら売主』かつ『買主が非業者』の場合に適用。①は売主が非業者なので適用なし。","trap":"『媒介』では8種制限は問題にならない。"},
{"id":50,"cat":"宅建業法","tag":"頻出論点","q":"宅建業者の従業者証明書に関する次の記述のうち、正しいものはどれか。","choices":["宅建士証を携帯していれば、従業者証明書の携帯は不要である。","代表取締役も、従業者証明書を携帯させなければならない。","非常勤役員には従業者証明書を携帯させる必要はない。","一時的に事務の補助をする者には従業者証明書は不要である。"],"answer":1,"exp":"②正：代表者・役員・パートも含む（48条）。①誤：宅建士証で代替不可。③④誤。","trap":""},
{"id":51,"cat":"宅建業法","tag":"ひっかけ","q":"宅建業者が自ら売主となる場合の、相手方の請求による損害賠償予定額等の制限について、正しいものはどれか（代金5,000万円、買主非業者）。","choices":["手付1,200万円の受領は、保全措置を講じれば可能である。","手付300万円の受領で、未完成物件なら保全措置は不要である。","手付1,000万円の受領は、保全措置を講じれば可能である（未完成物件）。","完成物件で手付600万円を受領する場合、保全措置は不要である。"],"answer":2,"exp":"③正：2割（1,000万円）以内で、5%（250万円）超のため保全措置を講じれば受領可。①誤：2割超は不可。②誤：300万円は5%（250万円）超のため保全措置が必要。④誤：完成物件は10%（500万円）超のため保全措置が必要。","trap":"数字の組合せ問題。"},
{"id":52,"cat":"宅建業法","tag":"頻出論点","q":"宅建業者の業務に関する次の記述のうち、宅建業法に違反しないものはどれか。","choices":["正当な理由なく、相手方が契約を締結しない旨の意思表示をした後も勧誘を継続した。","相手方が返還を求めた預り金を、契約が成立していないにもかかわらず返還を拒んだ。","深夜に電話で勧誘を行い、相手方を困惑させた。","将来の環境・交通事情について、断定的判断を提供しなかった。"],"answer":3,"exp":"①②③は禁止行為（規則16条の11、16条の12）。","trap":""},
{"id":53,"cat":"宅建業法","tag":"ひっかけ","q":"指定流通機構への登録に関する次の記述のうち、正しいものはどれか。","choices":["登録した物件の売買契約が成立したときは、遅滞なく、登録番号・取引価格・契約成立年月日を指定流通機構に通知しなければならない。","一般媒介契約でも、指定流通機構への登録義務がある。","登録したときは、登録を証する書面を依頼者に交付する必要はない。","専任媒介契約の登録期限は、契約日から7日以内（休業日を含む）である。"],"answer":0,"exp":"①正（34条の2第7項）。②誤：任意。③誤：遅滞なく交付。④誤：休業日を除く。","trap":"『休業日を除く』。"},
{"id":54,"cat":"宅建業法","tag":"頻出論点","q":"宅建業者が媒介した売買について、37条書面の記載事項として誤っているものはどれか。","choices":["物件の構造耐力上主要な部分等の状況について当事者双方が確認した事項（既存建物の場合）","水害ハザードマップにおける物件の所在地","代金の額並びにその支払の時期及び方法","宅地建物の引渡しの時期"],"answer":1,"exp":"②は35条の説明事項であり、37条書面の記載事項ではない。①は既存建物の場合の必要的記載事項。","trap":""},
{"id":55,"cat":"宅建業法","tag":"ひっかけ","q":"宅建業者Aが、宅建業者Bの媒介で、宅建業者Cに自己所有の宅地を売却した場合、正しいものはどれか。","choices":["35条書面は交付も説明も不要である。","37条書面は、業者間取引なので交付不要である。","35条書面は、Cが業者であるため説明を省略できるが、書面の交付は必要である。","クーリング・オフの規定が適用される。"],"answer":2,"exp":"③正（35条6項）。②誤：37条は業者間でも必要。④誤：業者間は適用なし。","trap":""},
{"id":56,"cat":"宅建業法","tag":"頻出論点","q":"宅建業者の免許の申請に関する次の記述のうち、正しいものはどれか。","choices":["1つの都道府県内に事務所を設置する場合でも、他県で取引をするなら大臣免許が必要である。","法人の免許申請者の役員に、執行猶予中の者がいても免許は受けられる。","免許の更新の申請は、有効期間満了の日の30日前までに行えばよい。","2以上の都道府県に事務所を設置して宅建業を営む場合、国土交通大臣の免許を受けなければならない。"],"answer":3,"exp":"④正（3条1項）。①誤：業務地域は無関係。②誤：役員が欠格者なら不可。③誤：満了の90日前から30日前までの間。","trap":"更新申請は『90日前〜30日前』。"},
{"id":57,"cat":"宅建業法","tag":"ひっかけ","q":"免許の更新申請をしたが、有効期間満了日までに処分がなされない場合について、正しいものはどれか。","choices":["従前の免許は、処分がなされるまでの間なお効力を有し、更新後の免許の有効期間は従前の免許の満了日の翌日から5年である。","処分がされない限り、満了日で失効する。","更新後の免許の有効期間は、処分がなされた日から5年である。","処分がされるまでの間は、新たな契約を締結できない。"],"answer":0,"exp":"①正（3条4項・5項）。","trap":"新免許の起算点は『満了日の翌日』。"},
{"id":58,"cat":"宅建業法","tag":"頻出論点","q":"宅建業法上の罰則等に関する次の記述のうち、正しいものはどれか。","choices":["名義貸しは罰則の対象とならない。","無免許営業は、3年以下の拘禁刑若しくは300万円以下の罰金又はこれを併科する。","重要事項の説明をしなかった場合、直ちに罰則が科される。","法人の従業者が無免許営業をした場合、法人には罰則は科されない。"],"answer":1,"exp":"②正（79条、2025年6月から拘禁刑）。①誤：無免許と同じ罰則。③誤：35条違反は監督処分の対象で直接の罰則なし。④誤：両罰規定（法人は1億円以下の罰金）。","trap":"35条違反自体には罰則なし（37条書面不交付は50万円以下の罰金）。"},
{"id":59,"cat":"宅建業法","tag":"ひっかけ","q":"宅建業者が建物の貸借の媒介を行う場合の35条書面の説明事項として、不要なものはどれか。","choices":["敷金等契約終了時に精算する金銭の精算に関する事項","契約期間及び契約更新に関する事項","私道に関する負担","管理の委託先（区分所有建物・マンションの場合）"],"answer":2,"exp":"建物の貸借では私道負担の説明は不要。①②④は貸借で必要。","trap":""},
{"id":60,"cat":"宅建業法","tag":"頻出論点","q":"宅建業者の取引態様の明示に関する次の記述のうち、正しいものはどれか。","choices":["取引態様の明示は書面で行わなければならない。","相手方が宅建業者である場合、取引態様の明示は不要である。","取引態様の明示は、契約締結時までに行えばよい。","広告時に取引態様を明示していても、注文を受けた際に改めて明示しなければならない。"],"answer":3,"exp":"④正（34条2項）。①誤：口頭でも可。②誤：業者間でも必要。③誤：注文を受けたとき遅滞なく。","trap":""},
{"id":61,"cat":"権利関係","tag":"頻出論点","q":"AがBと通謀して、A所有の土地をBに仮装譲渡し、Bが善意のCに転売した場合に関する次の記述のうち、正しいものはどれか。","choices":["Aは、Cが善意であれば、Cに過失があっても無効を対抗できない。","Aは、Cに過失があれば無効を対抗できる。","Cは、登記を備えなければAに対して所有権を主張できない。","Cが悪意でも、Cからの転得者Dが善意ならDは保護されない。"],"answer":0,"exp":"①正：94条2項は善意のみで足り無過失不要。③誤：登記不要（判例）。④誤：転得者Dが善意なら保護。","trap":"虚偽表示の第三者は『善意』のみ、登記も不要。"},
{"id":62,"cat":"権利関係","tag":"ひっかけ","q":"錯誤に関する次の記述のうち、正しいものはどれか。","choices":["錯誤による意思表示は無効である。","表意者に重大な過失があった場合でも、相手方が表意者に錯誤があることを知っていたときは取り消すことができる。","錯誤による取消しは、善意の第三者であれば過失があっても対抗できない。","動機の錯誤は、いかなる場合も取り消すことができない。"],"answer":1,"exp":"②正（95条3項1号）。①誤：2020年改正で『取消し』。③誤：善意無過失の第三者に対抗不可。④誤：動機が表示されていれば取消可。","trap":"改正前の『無効』と混同しない。"},
{"id":63,"cat":"権利関係","tag":"頻出論点","q":"詐欺・強迫に関する次の記述のうち、正しいものはどれか。","choices":["第三者の詐欺による意思表示は、相手方が知らなかった場合でも常に取り消せる。","詐欺による取消しは、善意の第三者であれば過失があっても対抗できない。","強迫による取消しは、善意無過失の第三者にも対抗できる。","強迫による意思表示は無効である。"],"answer":2,"exp":"③正。①誤：相手方が知り又は知ることができたときに限る（96条2項）。②誤：善意無過失の第三者に対抗不可。④誤：取消し。","trap":"強迫は第三者保護なし。"},
{"id":64,"cat":"権利関係","tag":"頻出論点","q":"無権代理に関する次の記述のうち、正しいものはどれか。","choices":["相手方の催告に本人が確答しないときは、追認したものとみなされる。","無権代理であることを知っていた相手方も、取消権を行使できる。","本人が追認した場合、追認の時から効力を生じる。","相手方は、本人に対し相当の期間を定めて追認するか催告でき、期間内に確答がなければ追認拒絶とみなされる。"],"answer":3,"exp":"④正（114条）。②誤：善意の相手方のみ（115条）。③誤：原則契約時に遡る（116条）。","trap":"確答なし＝『拒絶』。"},
{"id":65,"cat":"権利関係","tag":"ひっかけ","q":"代理に関する次の記述のうち、正しいものはどれか。","choices":["制限行為能力者が代理人としてした行為は、行為能力の制限を理由に取り消すことができない（原則）。","代理人は、行為能力者でなければならない。","任意代理人は、本人の許諾がなくても、いつでも復代理人を選任できる。","代理人が本人のためにすることを示さないでした意思表示は、常に無効である。"],"answer":0,"exp":"①正（102条）。③誤：本人の許諾又はやむを得ない事由が必要。④誤：自己のためにしたものとみなされ、相手方が知り又は知り得たときは本人に効果帰属。","trap":""},
{"id":66,"cat":"権利関係","tag":"頻出論点","q":"時効に関する次の記述のうち、正しいものはどれか。","choices":["所有権は、20年間行使しないときは時効により消滅する。","債権は、権利を行使できることを知った時から5年間、又は権利を行使できる時から10年間行使しないときは時効により消滅する。","時効の利益は、あらかじめ放棄することができる。","時効は、期間が経過すれば当事者が援用しなくても裁判所が考慮する。"],"answer":1,"exp":"②正（166条）。①誤：所有権は消滅時効にかからない。③誤：事前放棄不可（146条）。④誤：援用が必要（145条）。","trap":"所有権は消滅時効にかからない。"},
{"id":67,"cat":"権利関係","tag":"ひっかけ","q":"取得時効に関する次の記述のうち、正しいものはどれか。","choices":["占有開始時に善意であれば、過失があっても10年で時効取得できる。","賃借人として占有している者も、20年占有すれば所有権を時効取得できる。","占有開始時に善意無過失であれば、その後悪意となっても10年で取得時効が完成する。","前の占有者の占有期間を併せて主張する場合、前占有者の善意悪意は考慮されない。"],"answer":2,"exp":"③正（162条2項、判例）。①誤：無過失も必要。②誤：所有の意思（自主占有）が必要。④誤：前占有者の瑕疵も承継する。","trap":""},
{"id":68,"cat":"権利関係","tag":"頻出論点","q":"不動産の物権変動と登記に関する次の記述のうち、正しいものはどれか。","choices":["不法占拠者に対して所有権を主張するには、登記が必要である。","背信的悪意者に対しても、登記がなければ所有権を対抗できない。","相続人は、法定相続分を超える部分についても登記なく第三者に対抗できる。","AがBに土地を売却し、その後Cにも二重に売却した場合、先に登記を備えた者が所有権を取得する。"],"answer":3,"exp":"④正（177条）。①誤：不法占拠者は第三者に当たらない。②誤：背信的悪意者には登記なく対抗可。③誤：法定相続分を超える部分は登記が必要（899条の2）。","trap":""},
{"id":69,"cat":"権利関係","tag":"ひっかけ","q":"取消しと登記に関する次の記述のうち、判例に照らし正しいものはどれか。","choices":["AがBの詐欺によりBに土地を売却し、Aが取り消した後にBがCに売却した場合、AとCは対抗関係に立ち、先に登記した方が優先する。","取消し後の第三者Cは、善意無過失であれば登記なく保護される。","取消し後の第三者に対しては、Aは登記なく対抗できる。","取消し前の第三者に対しては、Aは常に対抗できる。"],"answer":0,"exp":"①正：取消し後の第三者とは対抗関係。④誤：取消し前の善意無過失の第三者には対抗不可。","trap":"取消し『前』は96条3項、『後』は177条。"},
{"id":70,"cat":"権利関係","tag":"頻出論点","q":"抵当権に関する次の記述のうち、正しいものはどれか。","choices":["抵当権者が物上代位するには、払渡し後に差押えをすれば足りる。","抵当権者は、抵当不動産の賃料債権に対して物上代位をすることができる。","抵当権は、抵当権設定当時に存在した従物には及ばない。","抵当権の被担保債権の利息は、全期間分について優先弁済を受けられる。"],"answer":1,"exp":"②正（判例）。①誤：払渡し又は引渡し前の差押えが必要。③誤：設定当時の従物に及ぶ。④誤：最後の2年分（375条）。","trap":"利息は『最後の2年分』。"},
{"id":71,"cat":"権利関係","tag":"ひっかけ","q":"法定地上権に関する次の記述のうち、判例に照らし正しいものはどれか。","choices":["更地に抵当権を設定した後に建物が建築された場合、法定地上権が成立する。","抵当権設定時に土地と建物の所有者が異なっていれば、その後同一人となっても法定地上権が成立する。","土地に抵当権を設定した当時、その土地上に土地所有者所有の建物が存在していれば、建物に登記がなくても法定地上権は成立しうる。","法定地上権が成立するのは、土地と建物の両方に抵当権が設定された場合に限られる。"],"answer":2,"exp":"③正（判例）。①誤：更地の場合は不成立。②誤：設定時に同一所有者であることが必要。④誤：一方でも成立。","trap":""},
{"id":72,"cat":"権利関係","tag":"頻出論点","q":"根抵当権に関する次の記述のうち、正しいものはどれか。","choices":["極度額の変更は、利害関係人の承諾がなくても行うことができる。","元本確定前の根抵当権は、被担保債権とともに随伴する。","根抵当権者は、極度額を超えても利息について優先弁済を受けられる。","元本確定前に被担保債権が譲渡された場合、譲受人はその債権について根抵当権を行使できない。"],"answer":3,"exp":"④正（398条の7）。①誤：利害関係人の承諾が必要。②誤：随伴性なし。③誤：極度額が上限。","trap":"被担保債権の範囲変更は後順位者の承諾不要、極度額変更は必要。"},
{"id":73,"cat":"権利関係","tag":"ひっかけ","q":"抵当権の消滅請求・代価弁済に関する次の記述のうち、正しいものはどれか。","choices":["抵当不動産の第三取得者は、抵当権消滅請求をすることができる。","主たる債務者も、抵当権消滅請求をすることができる。","抵当権消滅請求は、抵当権実行としての競売による差押えの効力発生後でもできる。","代価弁済は、第三取得者の請求により行われる。"],"answer":0,"exp":"①正（379条）。②誤：債務者・保証人等は不可（380条）。③誤：差押え前に限る。④誤：代価弁済は抵当権者の請求による。","trap":""},
{"id":74,"cat":"権利関係","tag":"頻出論点","q":"保証に関する次の記述のうち、正しいものはどれか。","choices":["連帯保証人は、催告の抗弁権を有する。","保証契約は、書面又は電磁的記録でしなければ効力を生じない。","個人が根保証契約をする場合、極度額を定めなくても有効である。","主たる債務者に対する履行の請求は、連帯保証人に対して効力を生じない。"],"answer":1,"exp":"②正（446条）。①誤：連帯保証人には催告・検索の抗弁権なし。③誤：極度額の定めがなければ無効（465条の2）。④誤：主債務者への請求は保証人にも及ぶ（457条）。","trap":"賃貸借の個人保証も極度額必須。"},
{"id":75,"cat":"権利関係","tag":"頻出論点","q":"連帯債務に関する次の記述のうち、正しいものはどれか（特約なし）。","choices":["連帯債務者の1人に対する履行の請求は、他の連帯債務者にも効力を生じる。","連帯債務者の1人について時効が完成した場合、他の連帯債務者もその分を免れる。","連帯債務者の1人について生じた更改は、他の連帯債務者に対しても効力を生じる。","連帯債務者の1人に対する免除は、他の連帯債務者にも効力を生じる。"],"answer":2,"exp":"③正：絶対効は弁済・更改・相殺・混同。①②④は2020年改正で相対効。","trap":"請求・免除・時効は相対効（改正後）。"},
{"id":76,"cat":"権利関係","tag":"頻出論点","q":"売買の契約不適合責任に関する次の記述のうち、正しいものはどれか。","choices":["買主は、売主に帰責事由がなければ代金減額請求をできない。","買主は、不適合が買主の帰責事由による場合でも追完請求できる。","数量不足の場合も、知った時から1年以内の通知が必要である。","種類・品質に関する不適合の場合、買主は不適合を知った時から1年以内に売主に通知しなければ、原則として権利を失う。"],"answer":3,"exp":"④正（566条）。①誤：代金減額は売主の帰責事由不要。②誤：不可（562条2項）。③誤：1年の期間制限は種類・品質のみ。","trap":"数量・権利の不適合には1年通知制限なし。"},
{"id":77,"cat":"権利関係","tag":"ひっかけ","q":"手付に関する次の記述のうち、民法の規定及び判例に照らし正しいものはどれか。","choices":["売主は、買主が履行に着手するまでは、手付の倍額を現実に提供して契約を解除できる。","売主は、手付の倍額を償還する旨を口頭で告げれば解除できる。","自ら履行に着手した当事者は、相手方が履行に着手していなくても手付解除できない。","手付解除をした場合でも、相手方は別途損害賠償を請求できる。"],"answer":0,"exp":"①正（557条）。②誤：現実の提供が必要。③誤：相手方が着手するまでは解除可。④誤：損害賠償請求不可。","trap":"自分が着手していても相手が未着手ならOK。"},
{"id":78,"cat":"権利関係","tag":"頻出論点","q":"賃貸借（民法）に関する次の記述のうち、正しいものはどれか。","choices":["敷金返還請求権は、賃借人の明渡しと同時履行の関係にある。","賃貸借の存続期間は50年を超えることができない。","賃借人が適法に転貸した場合、賃貸人は転借人に直接賃料を請求できない。","賃借物の一部が賃借人の帰責事由なく使用できなくなった場合、賃借人が請求しない限り賃料は減額されない。"],"answer":1,"exp":"②正（604条）。①誤：明渡しが先履行（622条の2）。③誤：直接請求可（613条）。④誤：当然に減額（611条）。","trap":"改正で『当然減額』。"},
{"id":79,"cat":"権利関係","tag":"ひっかけ","q":"賃借権の譲渡・転貸に関する次の記述のうち、正しいものはどれか。","choices":["賃借人の債務不履行による解除も、転借人に対抗できない。","無断転貸があれば、背信的行為と認めるに足りない特段の事情があっても解除できる。","賃貸人と賃借人が賃貸借を合意解除しても、賃貸人はこれを適法な転借人に対抗できない。","賃借人が賃貸人の承諾を得て賃借権を譲渡した場合、敷金は当然に新賃借人に承継される。"],"answer":2,"exp":"③正（613条3項）。①誤：債務不履行解除は対抗可。②誤：信頼関係破壊法理により解除不可。④誤：承継されない。","trap":"合意解除×、債務不履行解除○。"},
{"id":80,"cat":"権利関係","tag":"頻出論点","q":"借地借家法の借地権の存続期間に関する次の記述のうち、正しいものはどれか。","choices":["借地権の存続期間を20年と定めた場合、その定めは有効である。","借地契約の最初の更新後の期間は10年である。","2回目以降の更新後の期間は20年である。","借地権の存続期間は30年であり、契約でこれより長い期間を定めたときはその期間となる。"],"answer":3,"exp":"④正（3条）。①誤：30年となる。②誤：最初の更新は20年。③誤：2回目以降は10年。","trap":"30→20→10。"},
{"id":81,"cat":"権利関係","tag":"ひっかけ","q":"定期借地権等に関する次の記述のうち、正しいものはどれか。","choices":["事業用定期借地権の設定契約は、公正証書によってしなければならない。","一般定期借地権の設定は、口頭でも有効である。","事業用定期借地権は、居住用の賃貸マンションのために設定できる。","建物譲渡特約付借地権は、存続期間を20年以上としなければならない。"],"answer":0,"exp":"①正（23条3項）。②誤：書面（電磁的記録可）が必要。③誤：居住用は不可。④誤：30年以上。","trap":"事業用は『公正証書に限る』、一般定期は『書面』。"},
{"id":82,"cat":"権利関係","tag":"頻出論点","q":"借地権の対抗力に関する次の記述のうち、正しいものはどれか。","choices":["借地上の建物の登記が借地権者の妻名義でも対抗できる。","借地上の建物について借地権者名義の登記があれば、借地権の登記がなくても第三者に対抗できる。","建物の表示の登記では対抗力は認められない。","建物が滅失した場合、対抗力は直ちに失われ回復の方法はない。"],"answer":1,"exp":"②正（10条1項）。①誤：本人名義が必要（判例）。③誤：表示登記でも可。④誤：掲示により滅失から2年間対抗力維持可。","trap":"家族名義の登記は不可。"},
{"id":83,"cat":"権利関係","tag":"頻出論点","q":"借家（借地借家法）に関する次の記述のうち、正しいものはどれか。","choices":["賃貸人による解約申入れは、3月前にすれば足りる。","賃借人が造作買取請求権を行使しない旨の特約は無効である。","期間を1年未満とする建物賃貸借（定期建物賃貸借を除く）は、期間の定めがないものとみなされる。","建物の引渡しを受けても、登記がなければ新所有者に対抗できない。"],"answer":2,"exp":"③正（29条）。①誤：6月前、かつ正当事由必要。②誤：特約有効（37条で強行規定から除外）。④誤：引渡しで対抗可（31条）。","trap":"造作買取請求権の排除特約は有効。"},
{"id":84,"cat":"権利関係","tag":"ひっかけ","q":"定期建物賃貸借に関する次の記述のうち、正しいものはどれか。","choices":["期間1年未満の定期建物賃貸借は、期間の定めがないものとみなされる。","期間が1年以上の場合、賃貸人は期間満了の3月前までに終了の通知をすればよい。","居住用の定期建物賃貸借で、床面積200㎡以上なら賃借人の中途解約権がある。","賃貸人は、契約前に、更新がなく期間満了で終了する旨を、契約書とは別個の書面を交付（承諾があれば電磁的提供）して説明しなければならない。"],"answer":3,"exp":"④正（38条3項・4項）。①誤：定期建物は1年未満も有効。②誤：満了の1年前から6月前までに通知。③誤：200㎡未満の場合に中途解約権。","trap":"中途解約権は『200㎡未満』の居住用。"},
{"id":85,"cat":"権利関係","tag":"頻出論点","q":"法定相続分に関する次の記述のうち、正しいものはどれか。被相続人Aには配偶者Bと兄Cのみがいる。","choices":["Bの相続分は4分の3、Cは4分の1である。","Bの相続分は3分の2、Cは3分の1である。","Bがすべて相続する。","Bの相続分は2分の1、Cは2分の1である。"],"answer":0,"exp":"配偶者と兄弟姉妹は3/4と1/4（900条3号）。","trap":""},
{"id":86,"cat":"権利関係","tag":"ひっかけ","q":"相続に関する次の記述のうち、正しいものはどれか。","choices":["相続放棄は、相続開始前でも家庭裁判所の許可を得ればできる。","相続放棄をした者の子は、放棄した者を代襲して相続人となることはない。","相続人が相続の開始を知った時から6月以内に放棄しなければ単純承認とみなされる。","限定承認は、共同相続人の1人が単独ですることができる。"],"answer":1,"exp":"②正：放棄は代襲原因でない。①誤：開始前の放棄不可（遺留分放棄は許可で可）。③誤：3か月以内。④誤：共同相続人全員で。","trap":"『相続放棄』と『遺留分の放棄』のすり替え。"},
{"id":87,"cat":"権利関係","tag":"頻出論点","q":"遺留分に関する次の記述のうち、正しいものはどれか。","choices":["直系尊属のみが相続人の場合、遺留分は被相続人の財産の2分の1である。","遺留分侵害額請求権は、相続開始を知った時から3年で時効消滅する。","兄弟姉妹には遺留分がない。","遺留分を侵害する遺言は無効である。"],"answer":2,"exp":"③正。①誤：3分の1。②誤：相続開始及び侵害する贈与・遺贈を知った時から1年、開始から10年（1048条）。④誤：有効で金銭請求ができるだけ。","trap":"侵害遺言も有効。"},
{"id":88,"cat":"権利関係","tag":"頻出論点","q":"遺言に関する次の記述のうち、正しいものはどれか。","choices":["自筆証書遺言は、日付をパソコンで印字してもよい。","法務局で保管されている自筆証書遺言も、家庭裁判所の検認が必要である。","夫婦が同一の証書で共同して遺言することができる。","自筆証書遺言に添付する財産目録は、各頁に署名押印すれば自書でなくてもよい。"],"answer":3,"exp":"④正（968条2項）。①誤：全文・日付・氏名は自書。②誤：保管制度利用なら検認不要。③誤：共同遺言は禁止（975条）。","trap":""},
{"id":89,"cat":"権利関係","tag":"ひっかけ","q":"相続登記の申請義務化（2024年4月1日施行）に関する次の記述のうち、正しいものはどれか。","choices":["相続により所有権を取得した相続人は、自己のために相続の開始があったことを知り、かつ所有権を取得したことを知った日から3年以内に登記を申請しなければならない。","申請義務は、施行日前に開始した相続には適用されない。","正当な理由なく申請を怠った場合、50万円以下の罰金に処せられる。","相続人申告登記は、相続人全員が共同で申し出なければならない。"],"answer":0,"exp":"①正（不登法76条の2）。②誤：施行前の相続にも適用（2027年3月31日までの猶予）。③誤：10万円以下の過料。④誤：各相続人が単独で申出可。","trap":"罰金ではなく『過料』、施行前の相続も対象。"},
{"id":90,"cat":"権利関係","tag":"頻出論点","q":"区分所有法に関する次の記述のうち、正しいものはどれか。","choices":["建替え決議は、区分所有者及び議決権の各3分の2以上で行う。","規約の設定・変更・廃止は、区分所有者及び議決権の各4分の3以上の多数による集会の決議で行う。","管理者の選任は、区分所有者及び議決権の各4分の3以上の決議が必要である。","集会の招集通知は、会日より少なくとも2週間前に発しなければならない。"],"answer":1,"exp":"②正（31条）。①誤：各5分の4以上（62条）。③誤：普通決議（過半数）。④誤：1週間前（規約で伸縮可、建替えは2月前）。","trap":"規約3/4、建替え4/5、招集1週間前。"},
{"id":91,"cat":"権利関係","tag":"ひっかけ","q":"区分所有法の共用部分に関する次の記述のうち、正しいものはどれか。","choices":["共用部分の重大変更の議決権の定数も、規約で過半数まで減ずることができる。","共用部分の保存行為は、集会の決議がなければ行えない。","共用部分の重大変更は、区分所有者及び議決権の各4分の3以上の決議で行うが、区分所有者の定数は規約で過半数まで減ずることができる。","共用部分の持分は、専有部分と分離して処分できる。"],"answer":2,"exp":"③正（17条1項）。①誤：減じられるのは区分所有者の定数のみ。②誤：各共有者が単独でできる。④誤：原則分離処分不可。","trap":"減らせるのは『頭数』だけ。"},
{"id":92,"cat":"権利関係","tag":"頻出論点","q":"区分所有法の規約・集会に関する次の記述のうち、正しいものはどれか。","choices":["最初に建物の専有部分の全部を所有する者は、公正証書により共用部分に関するあらゆる事項を規約で定めることができる。","集会の議事録は、議長のみが署名すればよい。","占有者は、集会で議決権を行使できる。","規約は、管理者がいるときは管理者が保管しなければならない。"],"answer":3,"exp":"④正（33条）。①誤：規約共用部分・敷地利用権の分離処分等の一定事項に限る（32条）。②誤：議長及び集会に出席した区分所有者2人が署名。③誤：意見陳述のみ。","trap":""},
{"id":93,"cat":"権利関係","tag":"頻出論点","q":"共有（2023年4月施行の改正民法）に関する次の記述のうち、正しいものはどれか。","choices":["形状又は効用の著しい変更を伴わない共有物の変更（軽微変更）は、各共有者の持分の価格の過半数で決定できる。","共有物の変更は、軽微なものであっても共有者全員の同意が必要である。","所在不明の共有者がいる場合、他の共有者は裁判所の決定なしにその持分を取得できる。","共有物の管理者は、共有者以外の者から選任することはできない。"],"answer":0,"exp":"①正（251条1項・252条1項）。③誤：裁判所の決定が必要（262条の2）。④誤：共有者以外も可。","trap":""},
{"id":94,"cat":"権利関係","tag":"ひっかけ","q":"相隣関係（2023年4月施行改正）に関する次の記述のうち、正しいものはどれか。","choices":["越境した枝は、催告なしにいつでも自ら切り取ることができる。","隣地の竹木の枝が越境した場合、竹木所有者に切除を催告したにもかかわらず相当期間内に切除しないときは、土地所有者が自ら枝を切り取ることができる。","越境した根も、竹木所有者に切除させなければならない。","竹木所有者を知ることができない場合でも、自ら枝を切り取ることはできない。"],"answer":1,"exp":"②正（233条3項1号）。③誤：根は自ら切り取れる。④誤：所有者不明・所在不明なら自ら切除可、急迫の事情があるときも可。","trap":"根は従来から自分で切れる。"},
{"id":95,"cat":"権利関係","tag":"頻出論点","q":"不法行為に関する次の記述のうち、正しいものはどれか。","choices":["不法行為による損害賠償請求権は、すべて知った時から3年で時効消滅する。","使用者責任を負った使用者は、被用者に対して一切求償できない。","人の生命又は身体を害する不法行為の損害賠償請求権は、被害者が損害及び加害者を知った時から5年で時効消滅する。","不法行為の時から10年を経過すると請求できなくなる。"],"answer":2,"exp":"③正（724条の2）。②誤：信義則上相当な限度で求償可。④誤：20年。","trap":"生命身体侵害は5年、その他3年、長期20年。"},
{"id":96,"cat":"権利関係","tag":"ひっかけ","q":"工作物責任に関する次の記述のうち、正しいものはどれか。","choices":["所有者は、損害発生防止に必要な注意をしたことを証明すれば免責される。","占有者は無過失責任を負う。","賃借人が占有する建物の外壁落下では、所有者は一切責任を負わない。","占有者が損害発生防止に必要な注意をしたときは、所有者が無過失責任を負う。"],"answer":3,"exp":"④正（717条）：一次的に占有者（過失責任）、免責されれば所有者が無過失責任。","trap":"所有者は免責なし。"},
{"id":97,"cat":"権利関係","tag":"頻出論点","q":"制限行為能力者に関する次の記述のうち、正しいものはどれか。","choices":["成年被後見人が成年後見人の同意を得てした契約も取り消すことができる。","被保佐人は、保佐人の同意がなくても不動産を売却できる。","未成年者が法定代理人の同意を得ずに不動産を購入した場合、法定代理人のみが取り消せる。","制限行為能力者が行為能力者であると信じさせるため詐術を用いた場合でも、取り消すことができる。"],"answer":0,"exp":"①正：成年被後見人には同意の制度がない（日用品を除く）。②誤：重要な財産の売却は同意必要。③誤：本人も取消可。④誤：取消不可（21条）。","trap":""},
{"id":98,"cat":"権利関係","tag":"頻出論点","q":"債権譲渡に関する次の記述のうち、正しいものはどれか。","choices":["譲渡制限特約付債権の譲渡は、譲受人が善意でも無効である。","譲渡制限特約がある債権を譲渡した場合でも、債権譲渡自体は有効である。","債権譲渡の債務者以外の第三者への対抗要件は、通知又は承諾であり確定日付は不要である。","将来発生する債権は譲渡できない。"],"answer":1,"exp":"②正（466条2項）。③誤：確定日付ある証書が必要。④誤：可（466条の6）。","trap":""},
{"id":99,"cat":"権利関係","tag":"ひっかけ","q":"相殺に関する次の記述のうち、正しいものはどれか。","choices":["時効により消滅した債権は、いかなる場合も自働債権として相殺できない。","不法行為による損害賠償債権を自働債権として、被害者が相殺することもできない。","悪意による不法行為に基づく損害賠償債務を受働債権として、加害者は相殺できない。","差押え後に取得した債権でも、自働債権として差押債権者に相殺を対抗できる。"],"answer":2,"exp":"③正（509条）。①誤：消滅前に相殺適状なら可（508条）。②誤：被害者からは可。④誤：差押え前に取得した債権でなければ不可（511条）。","trap":""},
{"id":100,"cat":"権利関係","tag":"頻出論点","q":"請負に関する次の記述のうち、正しいものはどれか。","choices":["請負人は、仕事完成前であれば、いつでも契約を解除できる。","仕事の目的物の契約不適合について、注文者は引渡しから1年以内に請求しなければならない。","完成した建物に重大な不適合があれば、注文者は常に契約を解除できない。","注文者は、請負人が仕事を完成しない間は、いつでも損害を賠償して契約を解除できる。"],"answer":3,"exp":"④正（641条）。②誤：不適合を知った時から1年以内に通知（637条）。③誤：改正で解除制限は削除。","trap":""},
{"id":101,"cat":"権利関係","tag":"頻出論点","q":"不動産登記に関する次の記述のうち、正しいものはどれか。","choices":["新築した建物の所有者は、取得の日から1月以内に表題登記を申請しなければならない。","権利に関する登記は、すべて申請が義務付けられている。","登記の申請は、原則として登記権利者が単独で行う。","所有権保存登記は、表題部所有者の相続人は申請できない。"],"answer":0,"exp":"①正（47条）。②誤：原則任意（相続登記・住所等変更登記は義務化）。③誤：共同申請が原則。④誤：相続人も可（74条）。","trap":""},
{"id":102,"cat":"権利関係","tag":"ひっかけ","q":"所有権の登記名義人の住所等変更登記の義務化（2026年4月1日施行）に関する次の記述のうち、正しいものはどれか。","choices":["住所等の変更登記の申請期限は3年以内である。","所有権の登記名義人は、住所等の変更があった日から2年以内に変更登記を申請しなければならない。","正当な理由なく申請を怠った場合、10万円以下の過料に処せられる。","施行日前の住所変更には適用されない。"],"answer":1,"exp":"②正（不登法76条の5）。①誤：2年。③誤：5万円以下の過料。④誤：施行前の変更にも適用（2028年3月31日まで猶予）。","trap":"相続登記は3年・10万円、住所変更は2年・5万円。"},
{"id":103,"cat":"法令上の制限","tag":"頻出論点","q":"都市計画法の開発許可に関する次の記述のうち、正しいものはどれか（三大都市圏の特例・条例は考慮しない）。","choices":["市街化区域内で行う800㎡の開発行為は、開発許可が必要である。","市街化調整区域内で行う農業者の居住用住宅のための開発行為は、開発許可が必要である。","市街化区域内で行う1,000㎡の開発行為は、原則として開発許可が必要である。","区域区分の定めのない都市計画区域内で行う2,000㎡の開発行為は、開発許可が必要である。"],"answer":2,"exp":"③正：1,000㎡未満が不要。①誤：不要。②誤：市街化区域外の農林漁業者の住宅は不要。④誤：非線引きは3,000㎡未満不要。","trap":"『未満』が不要。1,000㎡ちょうどは必要。"},
{"id":104,"cat":"法令上の制限","tag":"ひっかけ","q":"開発許可が不要なものはどれか。","choices":["市街化調整区域内で行う病院の建築のための開発行為","市街化区域内で行う3,000㎡の学校建築のための開発行為","都市計画区域外で行う1.5haの分譲住宅の開発行為","市街化調整区域内で行う図書館の建築のための開発行為"],"answer":3,"exp":"④図書館は公益上必要な建築物で規模・区域を問わず不要。①病院・②学校は公益施設の例外に含まれない（2007年改正）。③1ha以上は必要。","trap":"学校・病院・社会福祉施設は許可必要。"},
{"id":105,"cat":"法令上の制限","tag":"頻出論点","q":"開発許可の手続に関する次の記述のうち、正しいものはどれか。","choices":["開発許可を申請しようとする者は、開発行為に関係がある公共施設の管理者と協議し、その同意を得なければならない。","開発許可を受けた土地では、工事完了公告前であれば、いかなる場合も建築物を建築できない。","開発許可の申請には、開発区域内の土地所有者全員の同意が必要である。","開発許可を受けた者が開発行為を廃止したときは、知事の許可を受けなければならない。"],"answer":0,"exp":"①正（32条）。②誤：工事用仮設建築物や知事の承認等の例外あり。③誤：相当数の同意。④誤：遅滞なく届出。","trap":"『全員』ではなく『相当数』。廃止は『届出』。"},
{"id":106,"cat":"法令上の制限","tag":"ひっかけ","q":"都市計画法の都市計画に関する次の記述のうち、正しいものはどれか。","choices":["市街化区域には、用途地域を定めないことができる。","市街化調整区域には、原則として用途地域を定めない。","準都市計画区域には、高度利用地区を定めることができる。","田園住居地域は、市街化調整区域に定めるものとされている。"],"answer":1,"exp":"②正。①誤：市街化区域には少なくとも用途地域を定める。③誤：準都市計画区域に高度利用地区は不可。④誤。","trap":""},
{"id":107,"cat":"法令上の制限","tag":"頻出論点","q":"都市計画事業制限に関する次の記述のうち、正しいものはどれか。","choices":["都市計画事業の事業地内で土地の形質の変更を行う場合、届出をすれば足りる。","非常災害の応急措置として行う建築物の建築であっても、都市計画施設の区域内では許可が必要である。","都市計画施設の区域内において建築物の建築をしようとする者は、原則として知事等の許可を受けなければならない。","都市計画事業の認可の告示後、事業地内の土地を有償譲渡する場合、許可が必要である。"],"answer":2,"exp":"③正（53条）。①誤：許可が必要（65条）。②誤：不要。④誤：事前に施行者に届出（67条）。","trap":""},
{"id":108,"cat":"法令上の制限","tag":"頻出論点","q":"建築基準法の建蔽率に関する次の記述のうち、正しいものはどれか。","choices":["防火地域内の耐火建築物は、すべての地域で建蔽率が10分の2緩和される。","準防火地域内の準耐火建築物については、建蔽率の緩和はない。","角地の緩和を受けると、建蔽率は10分の2加算される。","建蔽率の限度が10分の8とされている地域で、防火地域内にある耐火建築物等は、建蔽率の制限が適用されない。"],"answer":3,"exp":"④正（53条6項）。①誤：1/10加算（80%地域は適用除外）。②誤：準防火地域の耐火・準耐火建築物等も1/10加算。③誤：角地は1/10。","trap":""},
{"id":109,"cat":"法令上の制限","tag":"ひっかけ","q":"建築基準法の道路に関する次の記述のうち、正しいものはどれか。","choices":["建築物の敷地は、原則として道路に2m以上接しなければならない。","建築物の敷地は、道路に4m以上接しなければならない。","法42条2項道路の場合、道路中心線から1mの線が道路境界線とみなされる。","自動車専用道路に2m以上接していれば接道義務を満たす。"],"answer":0,"exp":"①正（43条）。③誤：2m後退。④誤：自動車専用道路は不可。","trap":"幅員4m・接道2m・2項道路は中心線から2m。"},
{"id":110,"cat":"法令上の制限","tag":"頻出論点","q":"用途制限に関する次の記述のうち、正しいものはどれか（特定行政庁の許可は考えない）。","choices":["第一種低層住居専用地域では、大学を建築することができる。","第一種低層住居専用地域では、小学校を建築することができる。","工業専用地域では、住宅を建築することができる。","第二種低層住居専用地域では、病院を建築することができる。"],"answer":1,"exp":"②正。①誤：大学は一低・二低・田住・工業・工専で不可。③誤：工専に住宅不可。④誤：病院は一低・二低・田住・工業・工専で不可。","trap":""},
{"id":111,"cat":"法令上の制限","tag":"ひっかけ","q":"建築確認に関する次の記述のうち、正しいものはどれか（2025年4月施行の改正後）。","choices":["都市計画区域外で木造2階建て延べ面積250㎡の住宅を新築する場合、建築確認は不要である。","防火地域内で床面積10㎡の増築をする場合、建築確認は不要である。","都市計画区域内で木造2階建て延べ面積150㎡の住宅を新築する場合、建築確認が必要である。","建築物の用途を変更して床面積300㎡の特殊建築物とする場合、建築確認は不要である。"],"answer":2,"exp":"③正：都市計画区域内は規模を問わず新築に確認必要。①誤：2025年4月改正後、2階建て以上又は延べ200㎡超の建築物は全国で確認必要。②誤：10㎡以内の増築の確認不要の例外は防火・準防火地域外に限る。④誤：200㎡超の特殊建築物への用途変更は確認必要。","trap":"防火・準防火地域では10㎡以内の増築でも確認必要。"},
{"id":112,"cat":"法令上の制限","tag":"頻出論点","q":"国土利用計画法の事後届出に関する次の記述のうち、正しいものはどれか。","choices":["市街化調整区域内で3,000㎡の土地を売買した場合、事後届出が必要である。","売主が国である場合でも、買主は事後届出をしなければならない。","都市計画区域外で8,000㎡の土地を売買した場合、事後届出が必要である。","市街化区域内で2,000㎡の土地を売買した場合、買主は契約締結日から2週間以内に届け出なければならない。"],"answer":3,"exp":"④正（23条）。①誤：その他の都市計画区域は5,000㎡以上。②誤：当事者の一方が国等なら不要。③誤：区域外は10,000㎡以上。","trap":"届出義務者は『権利取得者（買主）』。"},
{"id":113,"cat":"法令上の制限","tag":"ひっかけ","q":"国土利用計画法の事後届出に関する次の記述のうち、正しいものはどれか。","choices":["知事の勧告に従わなかった場合、その旨及び勧告内容を公表されることがあるが、売買契約は無効とならない。","勧告に従わなかった場合、罰則が科される。","事後届出をしなかった場合、売買契約は無効となる。","相続により市街化区域内の5,000㎡の土地を取得した場合も届出が必要である。"],"answer":0,"exp":"①正。②誤：罰則なし。③誤：契約は有効（罰則はあり）。④誤：相続は契約でないため不要。","trap":"届出しない→罰則あり、勧告無視→公表のみ。"},
{"id":114,"cat":"法令上の制限","tag":"頻出論点","q":"農地法に関する次の記述のうち、正しいものはどれか。","choices":["市街化区域内の農地を自己の住宅用地に転用する場合、4条の許可が必要である。","相続により農地を取得した場合、3条の許可は不要だが、遅滞なく農業委員会に届け出なければならない。","農地に抵当権を設定する場合、3条の許可が必要である。","5条の許可は、農業委員会が行う。"],"answer":1,"exp":"②正（3条の3）。①誤：あらかじめ農業委員会に届出で足りる。③誤：不要。④誤：知事（指定市町村長）。","trap":"市街化区域内の4条・5条は『届出』。"},
{"id":115,"cat":"法令上の制限","tag":"ひっかけ","q":"農地法に関する次の記述のうち、正しいものはどれか。","choices":["2アール未満の農地を農業用施設に転用する場合も、4条の許可が必要である。","競売で農地を取得する場合は、農地法の許可は不要である。","農地を一時的に資材置場として貸し付ける場合も、5条の許可が必要である。","登記簿上の地目が山林であれば、現に耕作されていても農地に当たらない。"],"answer":2,"exp":"③正：一時転用も許可必要。①誤：2a未満の農業用施設への転用は不要。②誤：競売も許可必要。④誤：現況で判断。","trap":"一時的でも許可必要、地目でなく現況。"},
{"id":116,"cat":"法令上の制限","tag":"頻出論点","q":"宅地造成及び特定盛土等規制法に関する次の記述のうち、正しいものはどれか。","choices":["宅地造成等工事規制区域内で、切土により高さ1.5mの崖を生ずる工事は許可が必要である。","宅地造成等工事規制区域内で、面積400㎡の盛土で崖を生じないものは許可が必要である。","宅地造成等工事規制区域内でも、農地における盛土は規制対象外である。","宅地造成等工事規制区域内で、盛土により高さ1mを超える崖を生ずる工事は、原則として知事の許可が必要である。"],"answer":3,"exp":"④正（12条、施行令3条）。①誤：切土は2m超。②誤：500㎡超。③誤：盛土規制法は農地・森林の盛土も対象。","trap":"盛土1m・切土2m・合わせ2m・盛土単独2m・500㎡。"},
{"id":117,"cat":"法令上の制限","tag":"ひっかけ","q":"盛土規制法の特定盛土等規制区域に関する次の記述のうち、正しいものはどれか。","choices":["特定盛土等規制区域内で一定規模の盛土等を行う場合、工事着手日の30日前までに知事に届け出なければならない。","特定盛土等規制区域内では、すべての盛土工事に許可が必要である。","特定盛土等規制区域は、市街地に限って指定される。","届出は工事完了後遅滞なく行えばよい。"],"answer":0,"exp":"①正（27条）。②誤：大規模な盛土等（崖高5m超・3,000㎡超等）のみ許可。③誤：市街地等区域以外の区域も対象。","trap":"規制区域＝許可、特定区域＝届出（大規模は許可）。"},
{"id":118,"cat":"法令上の制限","tag":"頻出論点","q":"盛土規制法に関する次の記述のうち、正しいものはどれか。","choices":["工事完了後の検査は不要である。","宅地造成等工事規制区域の指定の際、既に工事を行っている者は、指定の日から21日以内に知事に届け出なければならない。","規制区域内の土地所有者は、災害防止のための保全義務を負わない。","区域内で擁壁等を除却する工事は、届出不要である。"],"answer":1,"exp":"②正（21条1項）。①誤：完了検査が必要。③誤：常時安全な状態に維持する努力義務。④誤：一定の擁壁等の除却は工事着手の14日前までに届出。","trap":""},
{"id":119,"cat":"法令上の制限","tag":"頻出論点","q":"土地区画整理法に関する次の記述のうち、正しいものはどれか。","choices":["仮換地の指定後も、従前の宅地を使用収益できる。","仮換地の指定を受けた場合、従前の宅地の売買はできない。","仮換地が指定された場合、従前の宅地の所有者は、換地処分の公告日まで従前の宅地を使用収益できない。","換地処分は、各工区ごとに行うことはできない。"],"answer":2,"exp":"③正（99条）。②誤：処分可。④誤：工区ごとも可。","trap":"使用収益は仮換地、処分（売買・抵当）は従前の宅地。"},
{"id":120,"cat":"法令上の制限","tag":"ひっかけ","q":"土地区画整理事業の施行地区内の建築行為等の制限について、正しいものはどれか。","choices":["建築行為の制限は、施行者の許可を受ければよい。","土地の形質変更は、届出で足りる。","換地処分の公告後も建築制限は継続する。","事業認可の公告後、換地処分公告までは、建築物の新築には知事等の許可が必要である。"],"answer":3,"exp":"④正（76条）：許可権者は知事（市の区域内は市長）。①誤：施行者ではない。","trap":"許可権者は『施行者』ではなく『知事等』。"},
{"id":121,"cat":"法令上の制限","tag":"頻出論点","q":"建築基準法の容積率に関する次の記述のうち、正しいものはどれか。","choices":["前面道路の幅員が12m未満の場合、容積率は道路幅員に法定乗数を乗じた数値以下でなければならない。","前面道路の幅員が12m以上でも、法定乗数による制限を受ける。","容積率の算定上、共同住宅の共用廊下の床面積も延べ面積に算入する。","住宅の地下室は、延べ面積に一切算入しない。"],"answer":0,"exp":"①正（52条2項）。③誤：不算入。④誤：住宅部分の1/3まで不算入。","trap":""},
{"id":122,"cat":"法令上の制限","tag":"ひっかけ","q":"防火地域・準防火地域に関する次の記述のうち、正しいものはどれか。","choices":["建築物が防火地域と準防火地域にわたる場合、過半の属する地域の規定が適用される。","建築物が防火地域と準防火地域にわたる場合、原則として全部について防火地域の規定が適用される。","防火地域内の看板は、すべて不燃材料で造る必要がある。","準防火地域内では、建築物の屋上に看板を設置できない。"],"answer":1,"exp":"②正（65条）。①誤：用途地域等は過半主義だが防火規制は厳しい方。③誤：屋上設置又は高さ3m超のもの。","trap":"用途地域は過半、防火は厳しい方。"},
{"id":123,"cat":"法令上の制限","tag":"頻出論点","q":"都市計画法の地区計画に関する次の記述のうち、正しいものはどれか。","choices":["地区計画の区域内での建築は、市町村長の許可が必要である。","地区計画は、市街化調整区域には定めることができない。","地区整備計画が定められた地区計画区域内で建築物の新築を行う者は、着手の30日前までに市町村長に届け出なければならない。","地区計画は都道府県が定める。"],"answer":2,"exp":"③正（58条の2）。②誤：用途地域外でも一定の場合可。④誤：市町村が定める。","trap":""},
{"id":124,"cat":"法令上の制限","tag":"ひっかけ","q":"その他の法令上の制限に関する次の記述のうち、正しいものはどれか。","choices":["生産緑地地区内で建築物を建築する場合、農業委員会の許可が必要である。","河川法の河川保全区域内での土地の掘削は、知事の許可が必要である。","土壌汚染対策法の形質変更時要届出区域内での形質変更は、知事の許可が必要である。","道路法の道路予定区域内で土地の形質の変更を行う場合、道路管理者の許可が必要である。"],"answer":3,"exp":"④正（91条）。①誤：市町村長の許可。②誤：河川管理者。③誤：着手14日前までに届出。","trap":""},
{"id":125,"cat":"法令上の制限","tag":"頻出論点","q":"建築基準法の高さ制限に関する次の記述のうち、正しいものはどれか。","choices":["第一種低層住居専用地域では、原則として建築物の高さは10m又は12mのうち都市計画で定めた高さを超えてはならない。","北側斜線制限は、商業地域にも適用される。","日影規制は、商業地域でも条例で指定できる。","隣地斜線制限は、第一種低層住居専用地域に適用される。"],"answer":0,"exp":"①正（55条）。②誤：北側斜線は低層・中高層住居専用・田住のみ。③誤：商業・工業・工専は対象外。④誤：絶対高さ制限があるため適用なし。","trap":""},
{"id":126,"cat":"法令上の制限","tag":"ひっかけ","q":"開発許可を受けた開発区域内の土地における建築制限について、正しいものはどれか。","choices":["工事完了公告後は、いかなる建築物も自由に建築できる。","工事完了公告後は、予定建築物以外の建築物を新築するには原則として知事の許可が必要である（用途地域が定められている場合を除く）。","工事完了公告前でも、開発許可を受けた者は自由に予定建築物を建築できる。","用途地域が定められている区域でも、予定建築物以外の建築は許可が必要である。"],"answer":1,"exp":"②正（42条）。③誤：原則不可（37条の例外あり）。④誤：用途地域があれば制限なし。","trap":""},
{"id":127,"cat":"税・その他","tag":"頻出論点","q":"不動産取得税に関する次の記述のうち、正しいものはどれか。","choices":["贈与により不動産を取得した場合、不動産取得税は課されない。","不動産取得税は国税である。","相続により不動産を取得した場合、不動産取得税は課されない。","家屋の改築により価格が増加した場合でも、不動産取得税は課されない。"],"answer":2,"exp":"③正（形式的取得）。①誤：課税。②誤：道府県税。④誤：増加分に課税。","trap":"相続×、贈与○。"},
{"id":128,"cat":"税・その他","tag":"ひっかけ","q":"不動産取得税に関する次の記述のうち、正しいものはどれか。","choices":["土地の取得に係る標準税率は4%である（特例を考慮する）。","新築住宅の課税標準から控除される額は1,500万円である。","免税点は、土地の取得については課税標準50万円未満である。","宅地を取得した場合、課税標準は固定資産課税台帳価格の2分の1とされる特例がある。"],"answer":3,"exp":"④正（2027年3月31日まで）。①誤：土地・住宅は3%の特例（2027年3月31日まで）。②誤：1,200万円（認定長期優良住宅は1,300万円）。③誤：土地10万円未満。","trap":"控除1,200万円、免税点 土地10万・新築家屋23万・その他家屋12万。"},
{"id":129,"cat":"税・その他","tag":"頻出論点","q":"固定資産税に関する次の記述のうち、正しいものはどれか。","choices":["固定資産税の納税義務者は、賦課期日（1月1日）現在の所有者である。","年の途中で売却した場合、売主は売却後の期間分の固定資産税の還付を受けられる。","固定資産税の標準税率は1.5%である。","固定資産税の免税点は、土地20万円、家屋30万円である。"],"answer":0,"exp":"①正。②誤：還付なし（当事者間の精算は任意）。③誤：1.4%。④誤：土地30万、家屋20万。","trap":"土地30・家屋20を逆にした肢。"},

</script>
<script>
const CONFIDENCE=[{key:"sure",label:"確信あり"},{key:"unsure",label:"迷った"},{key:"guess",label:"勘"}];
const CATEGORIES=["宅建業法","権利関係","法令上の制限","税・その他"];
const EXAM_MIX={"宅建業法":20,"権利関係":14,"法令上の制限":8,"税・その他":8};
const PASS_RATIO=0.74; // 例年の合格点 36〜38/50 を基準
const EXAM_SECONDS=120*60;
const STORE_KEY="takken-drill-v1";
const ALL=(window.TAKKEN_QUESTIONS||[]);
const app=document.getElementById("app");
let state=null, timerId=null;

function loadStore(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{wrong:{},seen:0,correct:0}}catch(e){return{wrong:{},seen:0,correct:0,reveal:"end"}}}
function saveStore(s){try{localStorage.setItem(STORE_KEY,JSON.stringify(s))}catch(e){}}
let store=loadStore(); if(!store.reveal) store.reveal="end";

function shuffle(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function prepare(q){
  const order=shuffle([0,1,2,3]);
  return {...q,choices:order.map(i=>q.choices[i]),answer:order.indexOf(q.answer)};
}
function buildExamSet(){
  return shuffle(CATEGORIES.flatMap(c=>shuffle(ALL.filter(q=>q.cat===c)).slice(0,EXAM_MIX[c])));
}
function start(mode,opt){
  let pool;
  if(mode==="exam") pool=buildExamSet();
  else if(mode==="cat") pool=shuffle(ALL.filter(q=>q.cat===opt));
  else if(mode==="trap") pool=shuffle(ALL.filter(q=>q.tag==="ひっかけ"));
  else if(mode==="wrong") pool=shuffle(ALL.filter(q=>store.wrong[q.id]));
  else pool=shuffle(ALL).slice(0,opt);
  if(!pool.length){renderHome("該当する問題がありません。");return}
  state={reveal:mode==="exam"?"end":store.reveal,mode,label:modeLabel(mode,opt),items:pool.map(prepare),i:0,answers:[],deadline:mode==="exam"?Date.now()+EXAM_SECONDS*1000:null};
  clearInterval(timerId);
  if(state.deadline) timerId=setInterval(tick,1000);
  try{history.pushState({screen:"quiz"},"")}catch(e){}
  renderQuestion();
}
function modeLabel(mode,opt){return {exam:"本試験モード",cat:opt,trap:"ひっかけ特訓",wrong:"間違えた問題",rand:`ランダム${opt}問`}[mode]}
function tick(){
  const el=document.getElementById("timer"); if(!el) return;
  const left=Math.max(0,Math.round((state.deadline-Date.now())/1000));
  el.textContent=`残り ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  if(left===0){clearInterval(timerId);showResult()}
}

function renderHome(msg){
  clearInterval(timerId);
  const wrongCount=Object.keys(store.wrong).length;
  const rate=store.seen?Math.round(store.correct/store.seen*100):0;
  const counts=CATEGORIES.map(c=>`${c} ${ALL.filter(q=>q.cat===c).length}`).join(" / ");
  app.innerHTML=`<div class="stack">
    <div><div class="eyebrow">宅地建物取引士試験 対策</div>
      <h1>宅建 <em>一発合格</em>ドリル</h1>
      <p class="lead">過去問の頻出論点とひっかけ問題を、毎回ランダムな順番・選択肢の並びで出題します。</p></div>
    ${msg?`<div class="trapbox">${esc(msg)}</div>`:""}
    <div class="toggle"><b>答え合わせ</b>
      <button data-r="end" aria-pressed="${store.reveal==="end"}">最後にまとめて採点</button>
      <button data-r="each" aria-pressed="${store.reveal==="each"}">1問ごと</button></div>
    <div class="stats"><span class="chip">収録 ${ALL.length}問</span><span>${counts}</span></div>
    <div class="grid">
      <button class="mode primary" data-m="exam"><b>本試験モード 50問</b><span>本番と同じ分野配分・120分タイマー。最後にまとめて採点・全問解説</span></button>
      <button class="mode" data-m="rand" data-o="10"><b>ランダム10問</b><span>すき間時間の腕試し</span></button>
      <button class="mode" data-m="rand" data-o="25"><b>ランダム25問</b><span>半分模試</span></button>
      <button class="mode" data-m="trap"><b>ひっかけ特訓</b><span>数字・期間・主語のすり替えだけを集中演習</span></button>
      <button class="mode" data-m="wrong" ${wrongCount?"":"disabled"}><b>間違えた問題 ${wrongCount}問</b><span>正解するとリストから消えます</span></button>
    </div>
    <div><div class="eyebrow">分野別</div></div>
    <div class="grid">${CATEGORIES.map(c=>`<button class="mode" data-m="cat" data-o="${c}"><b>${c}</b><span>${ALL.filter(q=>q.cat===c).length}問</span></button>`).join("")}</div>
    <div class="stats"><span>これまでの解答 ${store.seen}問 ・ 正答率 ${rate}%</span></div>
    <p class="foot">学習記録はこの端末のブラウザにだけ保存されます。問題は最新の法改正を踏まえた改題です。最終確認は公式テキストで行ってください。</p>
  </div>`;
  app.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{store.reveal=b.dataset.r;saveStore(store);renderHome()}));
  app.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{
    const o=b.dataset.o; start(b.dataset.m,b.dataset.m==="rand"?Number(o):o)}));
}

function renderQuestion(){
  const q=state.items[state.i], n=state.items.length;
  app.innerHTML=`<div class="stack">
    <div class="top"><button class="btn ghost" id="back">← トップへ戻る</button><b>${esc(state.label)}</b><span>${state.i+1} / ${n} <span id="timer"></span></span></div>
    <div class="bar"><i style="width:${state.i/n*100}%"></i></div>
    <div class="panel stack">
      <div class="row"><span class="chip">${esc(q.cat)}</span><span class="chip ${q.tag==="ひっかけ"?"trap":""}">${esc(q.tag)}</span></div>
      <div class="q">${esc(q.q)}</div>
      <div class="choices">${q.choices.map((c,k)=>`<button class="choice" data-k="${k}"><span class="n">${k+1}</span><span>${esc(c)}</span></button>`).join("")}</div>
      <div id="after"></div>
    </div>
    <div class="row"><button class="btn ghost" id="quit">中断して結果を見る</button></div>
  </div>`;
  if(state.deadline) tick();
  app.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>pick(Number(b.dataset.k))));
  document.getElementById("quit").addEventListener("click",showResult);
  document.getElementById("back").addEventListener("click",goHome);
}
function pick(k){
  app.querySelectorAll(".choice").forEach((b,idx)=>b.classList.toggle("picked",idx===k));
  document.getElementById("after").innerHTML=`<div class="conf"><b>自信度は？</b>${CONFIDENCE.map(c=>`<button data-c="${c.key}">${c.label}</button>`).join("")}</div>`;
  document.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>answer(k,b.dataset.c)));
}
function goNext(){if(state.i===state.items.length-1) showResult(); else {state.i++;renderQuestion()}}
function answer(k,conf){
  const q=state.items[state.i], ok=k===q.answer;
  state.answers.push({q,picked:k,ok,conf});
  store.seen++; if(ok){store.correct++;delete store.wrong[q.id]} else store.wrong[q.id]=1;
  saveStore(store);
  if(state.reveal==="end"){goNext();return}
  app.querySelectorAll(".choice").forEach((b,idx)=>{b.disabled=true;
    if(idx===q.answer) b.classList.add("ok"); else if(idx===k) b.classList.add("ng")});
  const last=state.i===state.items.length-1;
  document.getElementById("after").innerHTML=`<div class="stack">
    <div class="verdict ${ok?"ok":"ng"}">${ok?"正解":"不正解"} <small style="font-family:var(--body);font-size:15px">正解は ${q.answer+1}</small></div>
    ${q.trap?`<div class="trapbox"><b>ひっかけポイント</b><br>${esc(q.trap)}</div>`:""}
    <div class="exp">${esc(q.exp)}</div>
    <div class="row"><button class="btn" id="next">${last?"結果を見る":"次の問題"}</button></div></div>`;
  const next=document.getElementById("next"); next.focus();
  next.addEventListener("click",goNext);
}
function showResult(){try{history.replaceState({screen:"result"},"")}catch(e){}renderResult()}
function goHome(){if(history.state&&history.state.screen){history.back()}else renderHome()}
window.addEventListener("popstate",()=>{window.scrollTo(0,0);renderHome()});
function renderResult(){
  clearInterval(timerId);
  const a=state.answers, total=state.items.length, right=a.filter(x=>x.ok).length;
  const ratio=total?right/total:0, passed=ratio>=PASS_RATIO;
  const rows=CATEGORIES.map(c=>{const xs=a.filter(x=>x.q.cat===c);if(!xs.length)return"";
    return `<tr><td>${c}</td><td>${xs.filter(x=>x.ok).length} / ${xs.length}</td></tr>`}).join("");
  const count=f=>a.filter(f).length;
  const lucky=count(x=>x.ok&&x.conf==="guess"), trapped=count(x=>!x.ok&&x.conf==="sure"), solid=count(x=>x.ok&&x.conf==="sure");
  const trapMiss=count(x=>!x.ok&&x.q.tag==="ひっかけ"), trapAll=count(x=>x.q.tag==="ひっかけ");
  const unanswered=state.items.length-total;
  const review=a.map((x,i)=>`<div class="miss stack" style="gap:6px">
    <div class="row"><b style="color:var(${x.ok?"--ok":"--ng"})">${x.ok?"○":"×"} 第${i+1}問</b><span class="chip">${esc(x.q.cat)}</span><span class="chip ${x.q.tag==="ひっかけ"?"trap":""}">${esc(x.q.tag)}</span><span class="chip">${esc((CONFIDENCE.find(c=>c.key===x.conf)||{}).label||"")}</span></div>
    <div>${esc(x.q.q)}</div>
    <div>${x.q.choices.map((c,k)=>`<div style="${k===x.q.answer?"color:var(--ok);font-weight:700":k===x.picked?"color:var(--ng);text-decoration:line-through":""}">${k+1}. ${esc(c)}${k===x.q.answer?"　← 正解":k===x.picked?"　← あなたの解答":""}</div>`).join("")}</div>
    ${x.q.trap?`<div class="trapbox"><b>ひっかけポイント</b><br>${esc(x.q.trap)}</div>`:""}
    <div class="exp">${esc(x.q.exp)}</div></div>`).join("");
  const reviewHtml=`<div class="panel stack"><div class="toggle"><b>解答と解説</b><button data-f="all" aria-pressed="true">全問</button><button data-f="ng" aria-pressed="false">間違いのみ</button></div><div id="review">${review}</div></div>`;
  app.innerHTML=`<div class="stack">
    <div class="eyebrow">${esc(state.label)} の結果</div>
    <div class="panel stack">
      <div class="score">${right}<small style="font-size:.4em"> / ${total}</small></div>
      <div class="pass" style="color:var(${passed?"--ok":"--ng"})">${total?(passed?"合格ライン到達（正答率74%以上）":`合格ラインまであと ${Math.max(0,Math.ceil(total*PASS_RATIO)-right)}問`):"解答がありません"}</div>
      <table><tr><th>分野</th><th>正解</th></tr>${rows}</table>
      ${unanswered>0?`<div class="foot">未解答 ${unanswered}問（不正解として扱います）</div>`:""}
    </div>
    <div class="panel stack"><b>実力診断</b>
      <div class="diag">
        <div><b>${solid}</b>本物の得点（確信して正解）</div>
        <div><b>${lucky}</b>まぐれ正解（勘で正解）本番では落とす前提で復習</div>
        <div><b>${trapped}</b>思い込みミス（確信して不正解）最優先で覚え直す</div>
        <div><b>${trapAll?trapMiss+" / "+trapAll:"-"}</b>ひっかけに引っかかった数</div>
      </div>
      <div class="foot">本番で信用できるのは「確信して正解」だけです。この数が合格ライン（50問中37）を超えるまで繰り返しましょう。</div>
    </div>
    <div class="row"><button class="btn" id="again">同じモードでもう一度</button><button class="btn ghost" id="home">← トップへ戻る</button></div>
    ${a.length?reviewHtml:""}
  </div>`;
  app.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{
    app.querySelectorAll("[data-f]").forEach(o=>o.setAttribute("aria-pressed",o===b));
    document.querySelectorAll("#review > .miss").forEach((el,i)=>el.hidden=b.dataset.f==="ng"&&a[i].ok)}));
  const {mode,label}=state;
  document.getElementById("again").addEventListener("click",()=>start(mode,mode==="rand"?Number(label.match(/\d+/)[0]):label));
  document.getElementById("home").addEventListener("click",goHome);
}
renderHome(ALL.length?"":"問題データを読み込めませんでした。");
</script>

</body></html>
